  --gradient-main:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);
  --color-bg:#f8fafc;--color-surface:#fff;--color-border:#e2e8f0;
  --color-text:#1e293b;--color-text-soft:#64748b;--color-text-muted:#94a3b8;
  --color-success:#16a34a;--color-danger:#ef4444;
  --shadow-card:0 4px 20px rgba(139,92,246,.10);
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-2xl:24px;--r-full:9999px;
  --max-width:480px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;color:var(--color-text);background:var(--color-bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--color-text)} /* 16px evita zoom automático no iPhone */
:focus-visible{outline:3px solid rgba(139,92,246,.45);outline-offset:2px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--color-secondary)!important;box-shadow:0 0 0 3px rgba(139,92,246,.15)}
img{display:block;max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{max-width:var(--max-width);margin:0 auto;min-height:100vh;background:var(--color-bg);position:relative}
@media(min-width:700px){body{background:#eef2f7}#app{box-shadow:0 0 60px rgba(0,0,0,.12)}}
.container{padding:0 16px}.pad{padding-top:16px;padding-bottom:40px}
.center{text-align:center}.center-pad{padding:60px 0;display:flex;justify-content:center}
.soft{color:var(--color-text-soft);font-size:13px;line-height:1.6}
.h1{font-size:22px;font-weight:800;line-height:1.25}.h1.sm{font-size:18px}.h2{font-size:15px;font-weight:700;margin-bottom:8px}
.grow{flex:1;min-width:0}.row-gap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.col-gap{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.card{background:var(--color-surface);border-radius:var(--r-xl);box-shadow:var(--shadow-card)}
.pad-card{padding:20px}
.gradient-text{background:var(--gradient-main);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* topo */
#top-nav{position:sticky;top:0;z-index:100;pointer-events:none}
.top-row{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:10px 12px 8px;position:relative;z-index:2;pointer-events:auto;border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.tabs-wrap{background:#fff;padding:0 12px 8px;border-bottom:1px solid var(--color-border);position:relative;z-index:1;pointer-events:auto;transition:transform .25s ease,opacity .2s ease}
#top-nav.compact .tabs-wrap{transform:translateY(-100%);opacity:0;pointer-events:none}
#top-nav.compact .top-row{border-bottom-color:var(--color-border);box-shadow:0 2px 10px rgba(30,41,59,.07)}
.top-right{display:flex;align-items:center}
.bell{position:relative}
.bell-badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--color-danger);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;border:2px solid #fff}
.brand{display:flex;align-items:center;gap:8px}
.brand-logo{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(99,102,241,.35))}
.brand-logo.big{width:72px;height:72px;margin:0 auto;filter:drop-shadow(0 12px 16px rgba(99,102,241,.40))}
.hero-logo{position:absolute;right:14px;top:14px;width:84px;height:84px;object-fit:contain;opacity:.95;filter:drop-shadow(0 14px 18px rgba(30,10,90,.45));transform:rotate(6deg);pointer-events:none}
.hero h1{padding-right:84px}
.brand-icon{width:34px;height:34px;border-radius:10px;background:var(--gradient-main);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px}
.brand-icon.big{width:56px;height:56px;border-radius:16px;font-size:30px;margin:0 auto}
.brand-name{font-size:18px;font-weight:800;background:var(--gradient-main);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.icon-btn{width:44px;height:44px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;color:var(--color-text-soft)}
.icon-btn:active{background:var(--color-bg)}
.icon-btn.sm{width:36px;height:36px}.icon-btn.danger{color:var(--color-danger)}
.tab-bar{display:flex;gap:4px;background:var(--color-bg);border-radius:var(--r-lg);padding:4px;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:1;flex-shrink:0;padding:10px;font-size:12px;font-weight:500;border-radius:var(--r-md);color:var(--color-text-soft);text-align:center;white-space:nowrap}
.tab-btn.active{background:#fff;color:var(--color-text);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:12px 20px;border-radius:var(--r-lg);min-height:44px;transition:.15s}
.btn:disabled{opacity:.6;cursor:wait}
.btn-primary{background:var(--gradient-main);color:#fff;box-shadow:0 4px 12px rgba(139,92,246,.3)}
.btn-outline{border:2px solid var(--color-primary);color:var(--color-primary)}
.btn-ghost{background:#fff;color:var(--color-text-soft);border:1px solid var(--color-border)}
.btn-danger{background:rgba(239,68,68,.08);color:var(--color-danger);border:1px solid rgba(239,68,68,.25)}
.btn-wa{background:#25D366;color:#fff}
.btn-sm{font-size:12px;padding:8px 14px;border-radius:var(--r-md);min-height:38px}
.btn-full{width:100%}.btn:active{transform:scale(.98)}
.linklike{display:block;margin:12px auto 0;font-size:13px;color:var(--color-primary);font-weight:600;padding:8px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--color-text-soft);margin-bottom:12px;padding:8px 0}

/* formulários */
.fld{margin-bottom:14px}
.field-label{display:block;font-size:13px;font-weight:600;color:var(--color-text-soft);margin-bottom:6px}
.field-input{width:100%;border:1.5px solid var(--color-border);border-radius:var(--r-lg);padding:12px 14px;background:#fff}
textarea.field-input{resize:vertical}
.phone-box{display:flex;border:1.5px solid var(--color-border);border-radius:var(--r-lg);overflow:hidden;background:#fff}
.phone-box span{padding:12px 10px;background:var(--color-bg);font-size:14px;color:var(--color-text-soft);font-weight:600;border-right:1px solid var(--color-border)}
.phone-box input{flex:1;min-width:0;padding:12px;border:none;background:transparent}
.type-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-pick label{cursor:pointer}.type-pick input{position:absolute;opacity:0;pointer-events:none}
.type-pick span{display:block;border:2px solid var(--color-border);border-radius:14px;padding:12px 8px;text-align:center}
.type-pick small{display:block;font-size:11px;color:var(--color-text-muted)}
.type-pick input:checked+span{border-color:var(--color-primary);background:rgba(99,102,241,.06);color:var(--color-primary)}
.type-pick input:focus-visible+span{outline:3px solid rgba(139,92,246,.45)}
.photo-upload-btn{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--color-border);border-radius:var(--r-xl);padding:16px;cursor:pointer;font-size:13px;color:var(--color-text-soft);background:var(--color-bg);text-align:center}
.previews{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.previews img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.note{font-size:12px;color:var(--color-text-muted);margin:8px 0 14px;line-height:1.5}
.warn-note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:var(--r-md);padding:12px;font-size:12px;color:#92400e;margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--color-bg);border-radius:var(--r-lg);padding:4px;margin:16px 0}
.seg a{text-align:center;padding:10px;border-radius:var(--r-md);font-size:13px;font-weight:600;color:var(--color-text-soft)}
.seg a.on{background:#fff;color:var(--color-text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--color-text-muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--color-border)}

/* início */
.hero{position:relative;overflow:hidden;border-radius:var(--r-2xl);padding:24px;margin-bottom:22px;background:var(--gradient-main)}
.hero::before{content:"";position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.hero h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px;line-height:1.3;position:relative}
.hero h1#hero-rot{min-height:86px;transition:opacity .35s ease,transform .35s ease}
.hero h1#hero-rot.out{opacity:0;transform:translateY(8px)}
.hero h1 .nmark{color:#fde68a}
.hero p{font-size:13px;color:rgba(255,255,255,.88);margin-bottom:18px;position:relative}
.tx-l{display:block;margin:14px 0 4px;font-size:12px}.tx-group textarea{width:100%;display:block}.tx-group .btn{margin-top:6px}
.landing-note{display:block;margin-top:10px;font-size:12px;color:rgba(255,255,255,.88);position:relative}
.welcome-safe{margin:-8px 0 20px;font-size:13px;font-weight:700;opacity:.95}
.landing-cta{background:#fff;color:var(--color-primary);font-weight:700;font-size:14px;padding:13px 24px;border-radius:var(--r-xl);box-shadow:0 8px 24px rgba(0,0,0,.15);display:inline-block;position:relative}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-head h2{font-size:15px;font-weight:700}.section-head>a:not(.btn){font-size:12px;color:var(--color-primary);font-weight:600}
#profiles-strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;margin:0 -16px 20px;padding-left:16px;padding-right:16px;scrollbar-width:none}
#profiles-strip::-webkit-scrollbar{display:none}
.story{flex-shrink:0;text-align:center;width:64px}
.story-ring{display:block;width:60px;height:60px;margin:0 auto 6px;padding:2px;border-radius:50%;background:var(--gradient-main)}
.story-ring.soon{background:#4c1d95}.story-ring.none{background:#e2e8f0}
.story-inner{display:block;width:100%;height:100%;background:#fff;border-radius:50%;padding:2px}
.story-name{display:block;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-cat{display:block;font-size:10px;color:var(--color-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.about-n{display:grid;gap:10px;margin:12px 0 14px}
.about-row{display:flex;gap:12px;align-items:flex-start;background:rgba(99,102,241,.06);border-radius:14px;padding:12px}
.about-row b{display:block;font-size:14px;margin-bottom:3px}
.about-row p{font-size:12.5px;line-height:1.5;color:var(--color-text-muted);margin:0}
.about-badge{flex:0 0 auto;min-width:46px;height:46px;padding:0 10px;border-radius:14px;background:var(--gradient-main);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.about-badge.sm{font-size:13px}
#intro-block{overflow:hidden;margin:-8px;padding:8px}
#intro-block.closing{transition:max-height .45s ease,opacity .45s ease,margin .45s ease;opacity:0;margin:0}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat-card{background:#fff;border-radius:var(--r-xl);padding:16px 8px;text-align:center;box-shadow:var(--shadow-card)}
.stat-value{font-size:20px;font-weight:800;background:var(--gradient-main);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:11px;color:var(--color-text-muted)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.cat-btn{background:rgba(99,102,241,.07);border-radius:14px;padding:12px 4px;text-align:center;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;text-align:center}
.mini-grid>div{background:rgba(99,102,241,.06);border-radius:12px;padding:12px 4px}.mini-grid b{display:block;font-size:16px}.mini-grid small{font-size:11px;color:var(--color-text-muted)}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips-scroll::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 16px;border-radius:var(--r-full);font-size:13px;font-weight:500;background:#fff;color:var(--color-text-soft);border:1px solid var(--color-border)}
.chip.active{background:var(--gradient-main);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(139,92,246,.3)}
.chip-cat{display:inline-block;font-size:11px;font-weight:600;color:var(--color-primary);background:rgba(99,102,241,.1);padding:3px 10px;border-radius:var(--r-full)}

/* cartões */
.pub-card-a,.pub-card-b,.pub-carousel-item,.service-feed-card{display:block;background:#fff;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-card)}
.pub-card-a{margin-bottom:16px}
.pub-img-full{width:100%;aspect-ratio:16/9;object-fit:cover}
.pub-img-half{width:100%;aspect-ratio:1/1;object-fit:cover}
.pub-img-carousel{width:100%;height:140px;object-fit:cover}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:13px;font-weight:600;color:rgba(30,41,59,.6)}
.pub-body{padding:12px}
.pub-title{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}.pub-title.one{-webkit-line-clamp:1}
.pub-meta{font-size:12px;color:var(--color-text-muted);margin-bottom:6px}
.price{font-weight:800;color:var(--color-primary);font-size:15px}.price.sm{font-size:13px}.price.lg{font-size:22px}
.pub-footer{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.pub-author{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-soft)}
.pub-author-avatar{width:24px;height:24px;border-radius:50%;background:var(--gradient-main);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.pub-author-avatar.big{width:38px;height:38px;font-size:14px}
.pub-card-b-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pub-carousel{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scroll-snap-type:x mandatory;scrollbar-width:none}.pub-carousel::-webkit-scrollbar{display:none}
.pub-carousel-item{flex-shrink:0;width:190px;scroll-snap-align:start}
.badge-expiry{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r-full)}
.badge-expiry.urgent{background:rgba(239,68,68,.1);color:var(--color-danger);border:1px solid rgba(239,68,68,.2)}
.badge-expiry.ok{background:rgba(34,197,94,.1);color:var(--color-success);border:1px solid rgba(34,197,94,.2)}
.expiry-bar{height:3px;border-radius:var(--r-full);background:var(--color-border);overflow:hidden;margin:10px 0 12px}.expiry-fill{height:100%;background:var(--gradient-main)}
.service-feed-card{margin-bottom:20px}
.svc-head{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}.svc-head-t{flex:1;display:flex;flex-direction:column;min-width:0}.svc-head-t small{font-size:11px;color:var(--color-text-muted)}
.service-feed-img{width:100%;aspect-ratio:16/9;object-fit:cover}
.service-feed-body{padding:14px 16px 16px}.service-feed-title{font-size:16px;font-weight:700;margin:6px 0 2px}
.service-feed-desc{font-size:13px;color:var(--color-text-soft);line-height:1.6;margin-top:6px}

/* avatar */
.avatar{border-radius:50%;background:linear-gradient(135deg,#e0e7ff,#ede9fe);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--color-primary);flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-md{width:48px;height:48px;font-size:18px}.avatar-lg{width:72px;height:72px;font-size:26px}.avatar-fill{width:100%;height:100%;font-size:20px}
.avatar.on-grad{background:rgba(255,255,255,.2);color:#fff;border:3px solid rgba(255,255,255,.4);margin-bottom:10px}

/* perfil */
.profile-cover{height:170px;background:var(--gradient-main);position:relative}
.profile-cover-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.2))}
.profile-avatar-wrap{position:relative;margin:-42px 0 0 16px;width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:var(--gradient-main);overflow:hidden;box-shadow:var(--shadow-card)}
.profile-avatar-wrap .avatar{background:var(--gradient-main);color:#fff;font-size:30px}
.profile-info{padding-top:10px;padding-bottom:40px}
.profile-name{font-size:22px;font-weight:800}.profile-handle{font-size:13px;color:var(--color-text-muted)}
.profile-category{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--color-primary);background:rgba(99,102,241,.1);padding:4px 10px;border-radius:var(--r-full)}
.profile-bio{font-size:13px;color:var(--color-text-soft);line-height:1.6;margin-top:12px;white-space:pre-line}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.profile-stats{display:flex;gap:28px;margin-top:16px;padding:14px 0;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border)}
.profile-stat-value{font-size:18px;font-weight:800}.profile-stat-label{font-size:11px;color:var(--color-text-muted)}
.profile-social-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.social-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:var(--r-lg);font-size:13px;font-weight:600;min-height:44px}
.social-btn.wide{grid-column:span 2}
.social-btn.whatsapp{background:#25D366;color:#fff}.social-btn.instagram{background:linear-gradient(135deg,#f09433,#dc2743,#bc1888);color:#fff}
.social-btn.facebook{background:#1877F2;color:#fff}.social-btn.tiktok{background:#010101;color:#fff}.social-btn.website{background:#fff;border:1px solid var(--color-border)}

/* detalhe */
.detail-img{width:100%;border-radius:var(--r-xl);aspect-ratio:4/3;object-fit:cover;margin-bottom:8px}
.detail-thumbs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.detail-thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;cursor:pointer}
.detail-desc{white-space:pre-line;font-size:14px;color:var(--color-text-soft);line-height:1.7;margin:12px 0 16px}
.loc{display:flex;align-items:center;gap:4px;margin-top:4px}
.author-card{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:var(--r-lg);margin-bottom:12px;box-shadow:var(--shadow-card)}
.author-card>span:nth-child(2){flex:1;display:flex;flex-direction:column}.author-card small{font-size:11px;color:var(--color-text-muted)}
.owner-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--color-border)}

/* listas / admin */
.admin-list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#fff;border-radius:var(--r-lg);margin-bottom:8px;box-shadow:var(--shadow-card)}
.li-t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li-s{font-size:11px;color:var(--color-text-muted)}
.li-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.admin-stat-card{background:#fff;border-radius:var(--r-xl);padding:16px;text-align:center;box-shadow:var(--shadow-card)}
.admin-stat-value{font-size:24px;font-weight:800}.admin-stat-label{font-size:11px;color:var(--color-text-muted)}
.admin-action{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:14px;box-shadow:var(--shadow-card);text-align:left;font-size:14px;width:100%}
.admin-action small{display:block;font-size:11px;color:var(--color-text-muted)}
.admin-ico{width:40px;height:40px;border-radius:10px;background:rgba(99,102,241,.1);color:var(--color-primary);display:flex;align-items:center;justify-content:center}

/* vazio, spinner, toast */
.empty{text-align:center;padding:40px 16px;color:var(--color-text-muted)}.empty-ico{opacity:.4;display:flex;justify-content:center;margin-bottom:10px}
.empty-t{font-size:15px;font-weight:700;color:var(--color-text)}.empty-s{font-size:13px;margin:4px 0 14px}

/** Lava o texto: transforma < > & " ' em símbolos inofensivos. */
function esc(v) {
  return String(v ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/** Só deixa passar links que começam por http(s) (evita "javascript:..."). */
function safeUrl(u) {
  const s = String(u ?? "").trim();
  return /^https?:\/\//i.test(s) ? s : "";
}

function initials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean).slice(0, 2);
  return parts.length ? parts.map(p => p[0].toUpperCase()).join("") : "?";
}

/** "João Silva" -> "joao-silva" (sem acentos, só letras/números/hífen) */
function slugify(text) {
  const s = String(text || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
  return s || "perfil";
}

function onlyDigits(v) { return String(v || "").replace(/\D/g, ""); }

/** Aceita 84xxxxxxx / 85... (9 dígitos a começar por 82-87), com ou sem 258. */
function normalizeMozPhone(v) {
  let d = onlyDigits(v);
  if (d.startsWith(CONFIG.COUNTRY_CODE) && d.length === 12) d = d.slice(3);
  return /^8[2-7]\d{7}$/.test(d) ? d : "";
}

function waLink(phone, text) {
  const d = normalizeMozPhone(phone);
  if (!d) return "";
  const msg = text ? "?text=" + encodeURIComponent(text) : "";
  return `https://wa.me/${CONFIG.COUNTRY_CODE}${d}${msg}`;
}

function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

function formatPrice(p) {
  if (p === null || p === undefined || p === "" || isNaN(Number(p))) return "A combinar";
  return Number(p).toLocaleString("pt-PT").replace(/\u00a0/g, " ") + " " + CONFIG.CURRENCY;
}

function toMillis(t) {
  if (!t) return 0;
  if (typeof t.toMillis === "function") return t.toMillis();
  if (typeof t === "number") return t;
  return 0;
}

function daysLeft(item) {
  return Math.max(0, Math.ceil((toMillis(item.expiresAt) - Date.now()) / DAY_MS));
}
function isActive(item) {
  return toMillis(item.expiresAt) > Date.now() && item.status === "active";
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/** "há 5 min", "há 2 h", "há 3 d" */
function timeAgo(t) {
  const m = toMillis(t); if (!m) return "agora mesmo";
  const s = Math.max(0, (Date.now() - m) / 1000);
  if (s < 60) return "agora mesmo";
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  return `há ${Math.floor(s / 86400)} d`;
}
/** Publicada há menos de CONFIG.NEW_HOURS horas? */
function isNew(l) {
  const c = toMillis(l.createdAt);
  return c > 0 && Date.now() - c < CONFIG.NEW_HOURS * 3600000;
}

/** Cores de reserva quando não há foto (sempre a mesma para o mesmo id). */
function placeholderGradient(seed) {
  const g = [
    "linear-gradient(135deg,#e0e7ff,#c7d2fe)", "linear-gradient(135deg,#fce7f3,#fbcfe8)",
    "linear-gradient(135deg,#d1fae5,#a7f3d0)", "linear-gradient(135deg,#fef3c7,#fde68a)",
    "linear-gradient(135deg,#ede9fe,#ddd6fe)", "linear-gradient(135deg,#e0f2fe,#bae6fd)"
  ];
  const n = String(seed || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0);
  return g[n % g.length];
}

/** Notificação curta no fundo do ecrã. */
let _toastTimer;
function toast(msg, ms = 3200) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

function friendlyError(err) {
  const c = (err && err.code) || "";
  const map = {
    "auth/invalid-credential": "Email ou palavra-passe incorrectos.",
    "auth/wrong-password": "Email ou palavra-passe incorrectos.",
    "auth/user-not-found": "Não existe conta com este email.",
    "auth/email-already-in-use": "Este email já tem conta. Tenta entrar.",
    "auth/weak-password": "A palavra-passe deve ter pelo menos 6 caracteres.",
    "auth/invalid-email": "O email não é válido.",
    "auth/requires-recent-login": "Por segurança, sai e entra outra vez na conta e tenta de novo.",
    "auth/operation-not-allowed": "O Firebase não deixa mudar o email assim. Fala connosco pela Ajuda.",
    "auth/missing-password": "Escreve a tua palavra-passe actual.",
    "auth/too-many-requests": "Muitas tentativas. Espera um pouco e tenta de novo.",
    "auth/network-request-failed": "Sem internet. Verifica a ligação.",
    "auth/popup-closed-by-user": "Entrada com Google cancelada.",
    "auth/popup-blocked": "O telemóvel bloqueou a janela. Permite pop-ups e tenta de novo.",
    "auth/unauthorized-domain": "Este endereço ainda não está autorizado no Firebase (ver guia, passo do domínio).",
    "permission-denied": "Sem permissão para esta acção.",
    "unavailable": "Sem ligação ao servidor. Tenta de novo.",
    "resource-exhausted": "Limite diário grátis atingido. Tenta amanhã."
  };
  if (map[c]) return map[c];
  if (err && err.userMessage) return err.userMessage;
  if (CONFIG.DEBUG) console.error(err);
  return "Algo correu mal. Tenta de novo.";
}

/** Lê o tamanho da foto SEM a abrir toda (JPEG, PNG, WebP). Devolve {w,h} ou null. */
async function probeImageSize(file) {
  try {
    const dv = new DataView(await file.slice(0, 262144).arrayBuffer());
    const n = dv.byteLength;
    if (n > 24 && dv.getUint32(0) === 0x89504e47) return { w: dv.getUint32(16), h: dv.getUint32(20) };      // PNG
    if (n > 4 && dv.getUint16(0) === 0xffd8) {                                                              // JPEG
      let p = 2;
      while (p + 9 < n) {
        if (dv.getUint8(p) !== 0xff) { p++; continue; }
        const mk = dv.getUint8(p + 1);
        if (mk === 0xff) { p++; continue; }
        if (mk === 0xd8 || mk === 0x01 || (mk >= 0xd0 && mk <= 0xd7)) { p += 2; continue; }
        if (mk >= 0xc0 && mk <= 0xcf && mk !== 0xc4 && mk !== 0xc8 && mk !== 0xcc)
          return { h: dv.getUint16(p + 5), w: dv.getUint16(p + 7) };
        p += 2 + dv.getUint16(p + 2);
      }
      return null;
    }
    if (n > 30 && dv.getUint32(0) === 0x52494646 && dv.getUint32(8) === 0x57454250) {                      // WebP
      const f = dv.getUint32(12);
      if (f === 0x56503820) return { w: dv.getUint16(26, true) & 0x3fff, h: dv.getUint16(28, true) & 0x3fff };
      if (f === 0x5650384c) { const b = dv.getUint32(21, true); return { w: (b & 0x3fff) + 1, h: ((b >> 14) & 0x3fff) + 1 }; }
      if (f === 0x56503858) return {
        w: 1 + (dv.getUint8(24) | (dv.getUint8(25) << 8) | (dv.getUint8(26) << 16)),
        h: 1 + (dv.getUint8(27) | (dv.getUint8(28) << 8) | (dv.getUint8(29) << 16)) };
    }
  } catch (e) {}
  return null;
}

/** Desenha numa tela pequena (lado maior = IMAGE_MAX_PX) e devolve um JPEG leve. */
function drawToBlob(src, w, h) {
  const r = Math.min(1, CONFIG.IMAGE_MAX_PX / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * r)); c.height = Math.max(1, Math.round(h * r));
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);   // PNG com transparência fica com fundo branco
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b), "image/jpeg", CONFIG.IMAGE_QUALITY));
}

/** Reduz a foto no telemóvel ANTES de enviar (poupa dados e espaço grátis).
 *  Aceita fotos de qualquer origem (câmara, galeria, WhatsApp, Google Fotos, captura de ecrã).
 *  Tenta 3 caminhos: (1) leitura leve já reduzida, (2) leitura normal, (3) enviar a original. */
async function compressImage(file) {
  const looksImage = (file.type || "").startsWith("image/") || /\.(jpe?g|png|webp|gif|heic|heif|avif|bmp)$/i.test(file.name || "");
  if (!looksImage) throw { userMessage: "Isto não parece uma foto. Escolhe uma imagem." };
  if (file.size > CONFIG.MAX_UPLOAD_MB * 1048576)
    throw { userMessage: `Foto muito grande (máx. ${CONFIG.MAX_UPLOAD_MB} MB).` };

  // 1) createImageBitmap: o telemóvel já decodifica reduzido (poupa memória em fotos de 48/50 megapixels)
  try {
    if (window.createImageBitmap) {
      const sz = await probeImageSize(file), max = CONFIG.IMAGE_MAX_PX;
      const opts = { imageOrientation: "from-image" };
      if (sz && Math.max(sz.w, sz.h) > max) opts.resizeWidth = Math.max(1, Math.round(sz.w * max / Math.max(sz.w, sz.h)));
      let bmp;
      try { bmp = await createImageBitmap(file, opts); } catch (e1) { bmp = await createImageBitmap(file); }
      const b = await drawToBlob(bmp, bmp.width, bmp.height);
      if (bmp.close) bmp.close();
      if (b) return b;
    }
  } catch (e) { if (CONFIG.DEBUG) console.warn("createImageBitmap falhou", e); }

  // 2) <img> normal
  try {
    const b = await new Promise((ok, no) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = async () => {
        try { ok(await drawToBlob(img, img.naturalWidth || img.width, img.naturalHeight || img.height)); }
        catch (e) { no(e); } finally { URL.revokeObjectURL(url); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); no(new Error("img")); };
      img.src = url;
    });
    if (b) return b;
  } catch (e) { if (CONFIG.DEBUG) console.warn("<img> falhou", e); }

  // 3) última hipótese: enviar a original (o Cloudinary sabe ler HEIC e outros formatos)
  if (file.size <= CONFIG.CLOUDINARY_MAX_MB * 1048576) return file;
  throw { userMessage: `Não consegui preparar esta foto (${(file.size / 1048576).toFixed(1)} MB). Escolhe outra, ou tira uma captura de ecrã dela.` };
}

/** Cria o perfil e reserva o link único (ex.: joao-silva, joao-silva-2...). */
async function apiCreateProfile(uid, data) {
  const base = slugify(data.proName || data.name);
  for (let i = 0; i < 8; i++) {
    const slug = i === 0 ? base : `${base}-${i + 1}`;
    try {
      await runTransaction(db, async tx => {
        const sref = doc(db, "slugs", slug);
        if ((await tx.get(sref)).exists()) throw { code: "slug-taken" };
        tx.set(sref, { uid });
        tx.set(doc(db, "profiles", uid), {
          ...data, slug, status: "active", createdAt: serverTimestamp()
        });
      });
      S.cache.profiles = null; S.cache.profileCount = null;
      return slug;
    } catch (e) {
      if (e.code !== "slug-taken") throw e;
    }
  }
  throw { userMessage: "Não consegui criar o teu link. Tenta com outro nome profissional." };
}

/** Actualiza o perfil (o link e o estado NÃO mudam aqui). */
async function apiUpdateProfile(uid, data) {
  const clean = { ...data };
  delete clean.slug; delete clean.status; delete clean.createdAt; delete clean.id;
  await updateDoc(doc(db, "profiles", uid), clean);
  S.cache.profiles = null;

/** Pede ao Cloudinary uma versão leve da foto (rápida em dados móveis). */
function img(url, w) {
  const u = safeUrl(url);
  return u.includes("/upload/") ? u.replace("/upload/", `/upload/f_auto,q_auto,w_${w || 800}/`) : u;
}

/** Traduz a resposta de erro do Cloudinary para uma frase clara. */
function cloudinaryMsg(status, msg) {
  const m = String(msg || "").toLowerCase();
  if (m.includes("preset")) return "As fotos não estão bem configuradas (preset). Avisa o administrador.";
  if (m.includes("cloud_name") || m.includes("cloud name") || status === 401 || status === 404) return "As fotos não estão bem configuradas (conta). Avisa o administrador.";
  if (m.includes("too large") || m.includes("size") || status === 413) return `Foto demasiado grande para o servidor (máx. ${CONFIG.CLOUDINARY_MAX_MB} MB).`;
  if (m.includes("invalid image") || m.includes("unsupported")) return "O ficheiro não é uma imagem válida.";
  if (m.includes("megapixel") || m.includes("dimension")) return "A foto tem demasiados pixels. Escolhe outra mais pequena.";
  return `Falhou o envio da foto (${status}). Tenta de novo.`;
}

/** Envia UM ficheiro já preparado (Blob). Tenta até 3 vezes se a rede falhar. */
async function apiUploadBlob(blob) {
  if (!PHOTOS_READY)
    throw { userMessage: "As fotos ainda não estão configuradas (ver guia, passo Cloudinary)." };
  let last;
  for (let attempt = 0; attempt < 3; attempt++) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
    try {
      const fd = new FormData();
      fd.append("file", blob, "foto.jpg");
      fd.append("upload_preset", CONFIG.CLOUDINARY.uploadPreset);
      fd.append("folder", "nlhangano");
      const r = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.CLOUDINARY.cloudName}/image/upload`,
        { method: "POST", body: fd, signal: ctl.signal });
      clearTimeout(to);
      let j = null; try { j = await r.json(); } catch (e) {}
      if (r.ok && j && j.secure_url) return j.secure_url;
      const msg = j && j.error && j.error.message;
      if (CONFIG.DEBUG) console.error("Cloudinary", r.status, msg);
      if (r.status >= 400 && r.status < 500) throw { userMessage: cloudinaryMsg(r.status, msg), fatal: true };
      last = { userMessage: "O servidor de fotos está ocupado. Tenta de novo daqui a pouco." };
    } catch (e) {
      clearTimeout(to);
      if (e && e.fatal) throw e;
      if (CONFIG.DEBUG) console.error("upload", e);
      last = { userMessage: navigator.onLine === false
        ? "Sem internet. Liga os dados móveis e tenta de novo."
        : "A ligação falhou ao enviar a foto. Verifica os dados móveis e tenta de novo." };
    }
    await new Promise(res => setTimeout(res, 700 * (attempt + 1)));
  }
  throw last;
}

async function apiUploadImage(file) { return apiUploadBlob(await compressImage(file)); }

async function apiAdminStats() {
  const now = Timestamp.now();
  const [u, all, act] = await Promise.all([
    getCountFromServer(collection(db, "profiles")),
    getCountFromServer(collection(db, "listings")),
    getCountFromServer(query(collection(db, "listings"), where("expiresAt", ">", now)))
  ]);
  const total = all.data().count, active = act.data().count;
  const out = { users: u.data().count, total, active, expired: total - active,
    today: 0, week: 0, publishers: 0, likes: 0, clicks: 0, views: 0, provinces: [], top: [], noPub: [], remind: [], visitsToday: 0, visitsWeek: 0 };
  try {                                           // números extra: lê até 1000 perfis e 1000 publicações (só o admin faz isto)
    const [pS, lS] = await Promise.all([
      getDocs(query(collection(db, "profiles"), orderBy("createdAt", "desc"), limit(1000))),
      getDocs(query(collection(db, "listings"), orderBy("createdAt", "desc"), limit(1000)))]);
    const t0 = new Date(); t0.setHours(0, 0, 0, 0);
    const prov = {};
    pS.docs.forEach(d => { const x = d.data(), t = toMillis(x.createdAt);
      if (t >= t0.getTime()) out.today++; if (t >= Date.now() - 7 * 864e5) out.week++;
      const k = x.province || "Sem província"; prov[k] = (prov[k] || 0) + 1; });
    const owners = new Set(), tops = [];
    lS.docs.forEach(d => { const x = d.data(); owners.add(x.ownerId);
      out.likes += x.likeCount || 0; out.clicks += x.waClicks || 0; out.views += x.viewCount || 0;
      tops.push({ id: d.id, title: x.title, owner: x.ownerName, clicks: x.waClicks || 0, views: x.viewCount || 0, likes: x.likeCount || 0 }); });
    out.publishers = owners.size;
    out.top = tops.sort((a, b) => (b.clicks * 3 + b.views + b.likes) - (a.clicks * 3 + a.views + a.likes)).slice(0, 5).filter(t => t.clicks + t.views + t.likes > 0);
    out.noPub = pS.docs.filter(d => !owners.has(d.id)).slice(0, 30).map(d => ({ id: d.id, ...d.data() }));
    // Lembretes: quem termina em breve, quem já ficou sem publicações activas, e quem ainda não publicou
    const prof = {}; pS.docs.forEach(d => { prof[d.id] = { id: d.id, ...d.data() }; });
    const by = {}, nowMs = Date.now();
    lS.docs.forEach(d => { const x = d.data(); (by[x.ownerId] = by[x.ownerId] || []).push({ title: x.title, exp: toMillis(x.expiresAt), st: x.status }); });
    const expiring = [], expired = [];
    Object.keys(by).forEach(uid => {
      const pr = prof[uid]; if (!pr || pr.status === "suspended") return;
      const act = by[uid].filter(a => a.st === "active" && a.exp > nowMs), soon = act.filter(a => a.exp - nowMs <= 2 * 864e5);
      if (soon.length) expiring.push({ kind: "expiring", p: pr, days: Math.max(1, Math.ceil((Math.min(...soon.map(a => a.exp)) - nowMs) / 864e5)), titles: soon.map(a => a.title), count: soon.length });
      else if (!act.length) expired.push({ kind: "expired", p: pr, titles: by[uid].map(a => a.title), count: by[uid].length });
    });
    expiring.sort((a, b) => a.days - b.days);
    out.remind = [...expiring, ...out.noPub.filter(u => u.status !== "suspended").map(u => ({ kind: "nopub", p: u })), ...expired].slice(0, 60);
    try {                                              // visitas por dia (contador próprio do site)
      const vs = await getDocs(collection(db, "stats"));
      const days = vs.docs.map(d => ({ day: d.id, n: (d.data().visits || 0) })).sort((a, b) => b.day.localeCompare(a.day));
      const k = new Date(); const today = `${k.getFullYear()}-${String(k.getMonth() + 1).padStart(2, "0")}-${String(k.getDate()).padStart(2, "0")}`;
      out.visitsToday = (days.find(x => x.day === today) || {}).n || 0;
      out.visitsWeek = days.slice(0, 7).reduce((a, x) => a + x.n, 0);
    } catch (e) {}
    out.provinces = Object.entries(prov).sort((a, b) => b[1] - a[1]);
  } catch (e) { if (CONFIG.DEBUG) console.warn("estatísticas extra", e); }
  return out;
}

function carousel(items) {
  return `<div class="pub-carousel">${items.map(l => { const n = (l.images || []).length; return `

/** Alterna: grande, dois lado a lado, carrossel... (sensação moderna e variada) */
function renderFeed(items) {
  let html = "", i = 0, n = 0;
  while (i < items.length) {
    const m = n++ % 3;
    if (m === 1 && i + 1 < items.length) { html += `<div class="pub-card-b-wrap">${cardB(items[i])}${cardB(items[i + 1])}</div>`; i += 2; }
    else if (m === 2 && items.length - i >= 2) { const c = items.slice(i, i + 3); html += carousel(c); i += c.length; }
    else { html += cardA(items[i]); i++; }
  }
  return `<div class="feed">${html}</div>`;
}

// ══════════ Acções e formulários (preenchidos nos outros ficheiros) ══════════
const ACTIONS = {};   // botões:   <button data-act="nome">
const FORMS = {};     // formulários: <form data-form="nome">

async function withBusy(btn, fn) {
  if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = "Aguarde…"; }
  try { return await fn(); }
  catch (e) { toast(friendlyError(e)); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = btn.dataset.t; } }
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a && ACTIONS[a.dataset.act]) { e.preventDefault(); withBusy(null, () => ACTIONS[a.dataset.act](a, e)); return; }
  const lk = e.target.closest('a[href^="#/"]');                 // links internos (#/vitrine, #/p/...)
  if (lk && !e.defaultPrevented && !e.ctrlKey && !e.metaKey) { e.preventDefault(); go(lk.getAttribute("href")); }
  if (e.target.closest("#drawer a")) closeDrawer();
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  if (FORMS[f.dataset.form]) withBusy(f.querySelector("[type=submit]"), () => FORMS[f.dataset.form](f));
});
document.addEventListener("change", e => { if (e.target.dataset.onchange && ACTIONS[e.target.dataset.onchange]) ACTIONS[e.target.dataset.onchange](e.target, e); });
document.addEventListener("input", e => { if (e.target.dataset.oninput && ACTIONS[e.target.dataset.oninput]) ACTIONS[e.target.dataset.oninput](e.target, e); });

// Conta os cliques nos botões de WhatsApp das publicações (sem atrapalhar a abertura do WhatsApp)
function trackWhatsApp(id, ownerId) {
  if (!db || !id) return;
  if (S.user && ownerId === S.user.uid) return;                 // os teus próprios cliques não contam
  const k = "nlh_wa_" + id;
  try { const t = Number(localStorage.getItem(k)) || 0; if (Date.now() - t < 6 * 3600000) return; localStorage.setItem(k, String(Date.now())); } catch (e) {}
  apiTrackWhatsApp(id).catch(e => { if (CONFIG.DEBUG) console.warn("clique não contado", e); });
}
document.addEventListener("click", e => {

// Contador "2/4" das fotos deslizantes (o evento scroll não "sobe", por isso usamos captura)
document.addEventListener("scroll", e => {
  const g = e.target;
  if (!g || !g.classList || !g.classList.contains("gal")) return;
  const i = Math.round(g.scrollLeft / Math.max(1, g.clientWidth));
  const c = g.parentElement && g.parentElement.querySelector(".gal-count");
  if (c) c.textContent = `${i + 1}/${g.dataset.n}`;
  if (g.id === "gal-main") $$(".detail-thumbs img").forEach((t, k) => t.classList.toggle("on", k === i));
}, true);

// Fotos a alternar sozinhas (vai e volta), só quando se vêem no ecrã; pára se a pessoa mexer
(function autoSlide() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const vis = new Set();
  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? vis.add(e.target) : vis.delete(e.target)), { threshold: 0.6 }) : null;
  const pause = e => { const g = e.target.closest && e.target.closest(".gal"); if (g) g._hold = Date.now() + 9000; };
  document.addEventListener("touchstart", pause, { passive: true }); document.addEventListener("pointerdown", pause, { passive: true }); document.addEventListener("wheel", pause, { passive: true });
  setInterval(() => {
    if (document.hidden || _lb) return;
    document.querySelectorAll(".gal[data-n]").forEach(g => {
      const n = +g.dataset.n; if (n < 2) return;
      if (io && !g._io) { g._io = 1; io.observe(g); }
      if (io ? !vis.has(g) : false) return;
      if (g._hold && Date.now() < g._hold) return;
      if (!g._next) { g._next = Date.now() + 1200 + Math.random() * 2400; return; }   // cada galeria começa em momento diferente
      if (Date.now() < g._next) return;
      g._next = Date.now() + 3600;
      const w = g.clientWidth || 1, i = Math.round(g.scrollLeft / w);
      let dir = g._dir || 1; if (i + dir > n - 1 || i + dir < 0) dir = -dir; g._dir = dir;
      g.scrollTo({ left: (i + dir) * w, behavior: "smooth" });
    });
  }, 700);
})();

// Foto que quase enche o quadro (formato parecido) = enche mesmo; as muito altas ou muito largas ficam inteiras com fundo desfocado
document.addEventListener("load", e => {
  const im = e.target; if (!im || im.tagName !== "IMG") return;
  const sl = im.closest && im.closest(".gal-wrap:not(.d) .gal-slide"); if (!sl) return;
  const r = im.naturalWidth / Math.max(1, im.naturalHeight), b = sl.getBoundingClientRect(), c = b.width / Math.max(1, b.height);
  if (r && c && Math.max(r / c, c / r) <= 1.28) sl.classList.add("cv");
}, true);

// ── Ver a foto grande (toca para abrir; toca outra vez para ampliar; desliza para as outras) ──
let _lb = null;
function openLightbox(urls, i) {
  closeLightbox(true);
  if (!urls.length) return;
  const d = document.createElement("div"); d.className = "lb"; _lb = { d, urls, i: i || 0 };
  d.innerHTML = `<div class="lb-top"><span id="lb-n"></span><button class="lb-x" type="button" aria-label="Fechar" data-lbx>×</button></div>
    <div class="lb-stage" id="lb-stage"><img id="lb-img" alt="" draggable="false"></div>
    ${urls.length > 1 ? `<button class="lb-nav l" type="button" data-lbp aria-label="Anterior">‹</button><button class="lb-nav r" type="button" data-lbn aria-label="Seguinte">›</button>` : ""}
    <div class="lb-hint">Toca na foto para ampliar</div>`;
  document.body.appendChild(d); document.body.style.overflow = "hidden";
  try { history.pushState({ lb: 1 }, "", location.href); } catch (e) {}
  showLb();
}
function showLb() {
  if (!_lb) return;
  const im = document.getElementById("lb-img"), st = document.getElementById("lb-stage"), n = document.getElementById("lb-n");
  st.classList.remove("zoom"); im.src = _lb.urls[_lb.i]; if (n) n.textContent = _lb.urls.length > 1 ? `${_lb.i + 1} / ${_lb.urls.length}` : "";
}
function stepLb(k) { if (_lb && _lb.urls.length > 1) { _lb.i = (_lb.i + k + _lb.urls.length) % _lb.urls.length; showLb(); } }
function closeLightbox(silent) {
  if (!_lb) return;
  _lb.d.remove(); _lb = null; document.body.style.overflow = "";
  if (!silent) { try { if (history.state && history.state.lb) history.back(); } catch (e) {} }
}
window.addEventListener("popstate", () => { if (_lb) closeLightbox(true); });
window.addEventListener("hashchange", () => closeLightbox(true));
window.addEventListener("offline", () => toast("Sem ligação à internet.", 4000));
window.addEventListener("online", () => toast("Ligação de volta!", 2500));
document.addEventListener("keydown", e => { if (!_lb) return; if (e.key === "Escape") closeLightbox(); if (e.key === "ArrowRight") stepLb(1); if (e.key === "ArrowLeft") stepLb(-1); });
document.addEventListener("click", e => {
  const t = e.target;
  if (_lb) {

    if (im) { const st = document.getElementById("lb-stage"); st.classList.toggle("zoom");

  }

function parseRoute() {
  const raw = (location.hash || S.startHash || "#/").slice(1);   // S.startHash: plano B quando o ambiente não deixa mudar o endereço
  const [path, qs] = raw.split("?");
  return { seg: path.split("/").filter(Boolean).map(decodeURIComponent), qs: new URLSearchParams(qs || "") };
}
/** Vai para outra página. Se o ambiente (ex.: pré-visualização dentro de uma app) não deixar
 *  mudar o endereço, guarda a página em memória e desenha na mesma — nunca fica preso. */
function go(hash) {
  try { location.hash = hash; } catch (e) {}
  let ok = false;
  try { ok = decodeURIComponent(location.hash) === decodeURIComponent(hash); } catch (e) { ok = location.hash === hash; }
  if (!ok) { S.startHash = hash; render(); }
}
/** Muda o endereço sem recarregar; com plano B igual ao go(). */
function startAt(hash) {
  try { history.replaceState(null, "", hash); return; } catch (e) {}
  go(hash);
}

ACTIONS.reload = () => location.reload();

/** Guarda que já viste a página de entrada (para não voltar a aparecer sempre). */
function markSeen() { try { localStorage.setItem("nlh_seen", "1"); } catch (e) {} }
function wasSeen() { try { return localStorage.getItem("nlh_seen") === "1"; } catch (e) { return true; } }
/** Endereço da página sem o "#..." (funciona também a abrir o ficheiro directamente). */
const pageUrl = () => location.href.split("#")[0];

let _renderTok = 0;
async function render() {
  if (!S.ready) return;
  const tok = ++_renderTok;
  const { seg, qs } = parseRoute();
  const key = seg[0] || "inicio";
  if (key !== "inicio" && key !== "bem-vindo") S.introGone = true;   // quem sai do Início já não volta a ver o bloco de números e categorias
  document.body.classList.toggle("landing", key === "bem-vindo");
  document.body.dataset.route = key;   // esconde o cabeçalho na página de entrada
  if (key !== "bem-vindo") markSeen();
  const own = key === "p" && S.profile && seg[1] === S.profile.slug;
  renderTabs(own ? "perfil" : ({ perfil: "perfil", p: "", a: "", entrar: "perfil" }[key] ?? key));
  const view = $("#view");
  view.innerHTML = SPINNER;
  window.scrollTo(0, 0);
  { const nv = $("#top-nav"); if (nv) nv.classList.remove("compact"); }
  // Firebase ainda a ligar? Mostra a roda; o site volta a desenhar sozinho quando estiver pronto.
  if (key !== "bem-vindo" && FIREBASE_READY && (S.fb === "loading" || (!S.authKnown && PROTECTED.includes(key)))) return;
  try {
    let html;
    switch (key) {
      case "bem-vindo": html = await viewWelcome(); break;
      case "inicio": html = await viewHome(); break;
      case "vitrine": html = await viewShowcase(qs.get("cat") || "Todos", qs.get("prov") || ""); break;
      case "servicos": html = await viewServices(qs.get("cat") || "Todos", qs.get("prov") || ""); break;
      case "p": html = await viewProfile(seg[1]); break;
      case "perfil": html = await viewProfile(null); break;
      case "a": html = await viewListing(seg[1]); break;
      case "publicar": html = await viewBatchForm(qs.get("kind")); break;
      case "publicar-varias": html = await viewBatchForm(qs.get("kind")); break;
      case "publicar-um": html = await viewListingForm(null, qs.get("kind")); break;
      case "editar": html = await viewListingForm(seg[1]); break;
      case "minhas": html = await viewMine(); break;
      case "entrar": html = await viewAuth(qs.get("m")); break;
      case "criar-perfil": html = await viewProfileForm(false); break;
      case "editar-perfil": html = await viewProfileForm(true); break;
      case "pesquisar": html = await viewSearch(); break;
      case "admin": html = await viewAdmin(); break;
      case "avisos": html = await viewNotifications(); break;
      default: html = notFoundBox();
    }
    if (tok !== _renderTok || html === null) return; // outra página já tomou conta, ou houve redirecionamento
    view.innerHTML = html;
    trackVisitOnce();
    if (typeof afterRender === "function") afterRender(key);
    refreshBell();
  } catch (e) {
    if (tok !== _renderTok) return;
    if (CONFIG.DEBUG) console.error(e);
    view.innerHTML = cloudBox(navigator.onLine === false ? "Sem ligação à internet" : "Ops! Não foi possível carregar", friendlyError(e),
      `<button class="btn btn-primary" data-act="retry">Tentar de novo</button>`);
  }
}
ACTIONS.retry = () => { S.cache.listings = null; render(); };
window.addEventListener("hashchange", render);

// ══════════ Protecções de acesso ══════════
function requireAuth(next) {
  if (S.user) return true;
  S.next = next || location.hash; toast("Entra na tua conta primeiro."); go("#/entrar"); return false;
}
function requireProfile(next) {
  if (!requireAuth(next)) return false;
  if (S.profileLoadFailed) { toast("Sem ligação. Tenta de novo."); return false; }
  if (!S.profile) { S.next = next || location.hash; toast("Completa o teu perfil primeiro."); go("#/criar-perfil"); return false; }
  return true;
}

function setLikeUi(id, on) {
  const l = LST.get(id), n = l ? (l.likeCount || 0) : 0;
  $$(`.like-btn[data-id="${CSS.escape(id)}"]`).forEach(b => {
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
    const sp = b.querySelector(".like-n"); if (sp) sp.textContent = n > 0 ? n : "";
  });
}
/** onlyLike = true -> só dá gosto (usado no duplo toque; nunca retira). */
async function toggleLike(id, onlyLike) {
  const l = LST.get(id); if (!l) return;
  if (!requireProfile()) return;
  if (l.ownerId === S.user.uid) { toast("Não podes dar gosto à tua própria publicação."); return; }
  const was = S.myLikes.has(id);
  if (onlyLike && was) return;
  const now = !was;
  // mostra já no ecrã (optimista); se o servidor recusar, volta atrás
  if (now) S.myLikes.add(id); else S.myLikes.delete(id);
  l.likeCount = Math.max(0, (l.likeCount || 0) + (now ? 1 : -1));
  setLikeUi(id, now);
  try { await apiSetLike(l, now); }
  catch (e) {
    if (now) S.myLikes.delete(id); else S.myLikes.add(id);
    l.likeCount = Math.max(0, (l.likeCount || 0) + (now ? -1 : 1));
    setLikeUi(id, !now);
    throw e;
  }
}
ACTIONS.like = el => toggleLike(el.dataset.id, false);

function mapCategory(text, kind) {
  const t = norm(text), table = CATEGORY_WORDS[kind === "service" ? "service" : "product"];
  for (const [cat, words] of Object.entries(table)) if (words.some(w => t.includes(w))) return cat;

function resolveCategory(fd, kind) {
  const category = val(fd, "category"), custom = val(fd, "categoryCustom");
  if (category !== "Outro") return { category, categoryCustom: "" };
  if (custom.length < 3) throw { userMessage: "Escreve, em poucas palavras, o que vendes ou fazes (ex.: computadores)." };
  return { category: mapCategory(custom, kind) || "Outro", categoryCustom: custom };
}

const PH = { photos: [], avatar: null, cover: null, busy: 0, busySlot: "", existing: { avatar: "", cover: "", photos: [] } };
function resetPhotos(existing) {
  [...PH.photos, PH.avatar, PH.cover].forEach(p => p && URL.revokeObjectURL(p.url));
  PH.photos = []; PH.avatar = PH.cover = null; PH.busy = 0; PH.busySlot = "";
  PH.existing = { avatar: "", cover: "", photos: [], ...(existing || {}) };
}
function photoTiles(slot) {
  const tile = (src, k) => `<div class="pv"><img src="${esc(src)}" alt="">${k === null ? "" : `<button type="button" class="pv-x" data-act="photo-rm" data-slot="${slot}" data-i="${k}" aria-label="Remover foto">×</button>`}</div>`;
  let html = "";
  if (slot === "photos") {
    html = PH.photos.length ? PH.photos.map((p, i) => tile(p.url, i)).join("")
         : PH.existing.photos.map(u => tile(img(u, 200), null)).join("");
  } else if (PH[slot]) html = tile(PH[slot].url, 0);
  else if (PH.existing[slot]) html = tile(img(PH.existing[slot], 200), null);
  if (slot === "photos" && PHOTOS_READY && PH.photos.length && PH.photos.length < CONFIG.MAX_IMAGES)
    html += `<label class="pv pv-add" aria-label="Juntar mais fotos">${ic("plus", 26)}<small>Juntar</small><input type="file" accept="image/*" multiple hidden data-onchange="pick-photo" data-slot="photos"></label>`;
  return html + (PH.busy && PH.busySlot === slot ? `<div class="pv pv-wait"><div class="spinner"></div></div>` : "");
}
function paintPhotos(slot) {
  const box = document.getElementById("pv-" + slot); if (box) box.innerHTML = photoTiles(slot);
  const c = document.getElementById("ph-count"); if (c) c.textContent = PH.photos.length;
}
async function waitPhotos() {
  const t0 = Date.now();
  while (PH.busy > 0) {
    if (Date.now() - t0 > 60000) throw { userMessage: "As fotos ainda estão a ser preparadas. Espera um momento." };
    await new Promise(r => setTimeout(r, 150));
  }
}

ACTIONS["pick-photo"] = async el => {
  const slot = el.dataset.slot, files = Array.from(el.files || []);
  el.value = "";                                   // limpa, para poderes escolher a mesma foto outra vez
  if (!files.length) return;
  const multi = slot === "photos";
  const room = multi ? CONFIG.MAX_IMAGES - PH.photos.length : 1;
  if (room <= 0) { toast("Esta publicação já está bem recheada de fotos! Para mostrar mais, cria outra publicação.", 4500); return; }
  if (files.length > room) toast("Juntei as primeiras fotos. As restantes ficam para outra publicação.", 4500);
  for (const f of files.slice(0, room)) {
    PH.busy++; PH.busySlot = slot; paintPhotos(slot);
    try {
      const blob = await compressImage(f), item = { blob, url: URL.createObjectURL(blob) };
      if (multi) PH.photos.push(item);
      else { if (PH[slot]) URL.revokeObjectURL(PH[slot].url); PH[slot] = item; }
    } catch (e) { toast(friendlyError(e), 5000); }
    PH.busy--; paintPhotos(slot);
  }
};
ACTIONS["photo-rm"] = el => {
  const slot = el.dataset.slot, i = Number(el.dataset.i);
  if (slot === "photos") { const p = PH.photos.splice(i, 1)[0]; if (p) URL.revokeObjectURL(p.url); }

  paintPhotos(slot);
};

function cleanHandle(v) { return v.replace(/^@/, "").replace(/[^\w.\-]/g, "").slice(0, 60); }

FORMS.profile = async f => {

  if (!val(fd, "category")) throw { userMessage: "Escolhe a tua categoria." };
  let website = val(fd, "website");
  if (website && !/^https?:\/\//i.test(website)) website = "https://" + website;
  if (website && !safeUrl(website)) throw { userMessage: "O website não é válido." };

  const data = {
    type: val(fd, "type") === "service" ? "service" : "seller",
    name, proName: val(fd, "proName"), phone,
    province: val(fd, "province"), city: val(fd, "city"), ...resolveCategory(fd, val(fd, "type") === "service" ? "service" : "product"), bio: val(fd, "bio"),
    instagram: cleanHandle(val(fd, "instagram")), tiktok: cleanHandle(val(fd, "tiktok")),

    photoUrl: (S.profile && S.profile.photoUrl) || "", coverUrl: (S.profile && S.profile.coverUrl) || ""
  };
  await waitPhotos();
  if (PH.avatar) { toast("A enviar foto de perfil…", 15000); data.photoUrl = await apiUploadBlob(PH.avatar.blob); }
  if (PH.cover) { toast("A enviar capa…", 15000); data.coverUrl = await apiUploadBlob(PH.cover.blob); }

  if (editing) {
    await apiUpdateProfile(S.user.uid, data);
    S.profile = { ...S.profile, ...data };
    toast("Perfil actualizado!");
  } else {
    await apiCreateProfile(S.user.uid, data);
    S.profile = await apiLoadProfile(S.user.uid);
    toast("Perfil criado! Já tens o teu link.");
  }
  resetPhotos(); S.next = null; go("#/perfil");
};

FORMS.listing = async f => {
  if (!requireProfile()) return;
  const fd = new FormData(f), id = f.dataset.id;
  const kind = id ? f.dataset.kind : (val(fd, "kind") === "service" ? "service" : "product");
  const title = val(fd, "title"), category = val(fd, "category"), description = val(fd, "description");
  const whatsapp = normalizeMozPhone(val(fd, "whatsapp"));
  const priceRaw = val(fd, "price");
  if (title.length < 3) throw { userMessage: "O título deve ter pelo menos 3 caracteres." };
  if (!category) throw { userMessage: "Escolhe uma categoria." };
  if (kind === "service" && description.length < 10) throw { userMessage: "Descreve o serviço (mínimo 10 caracteres)." };
  if (!whatsapp) throw { userMessage: "WhatsApp inválido. Usa 9 dígitos (ex.: 84 123 4567)." };
  let price = null;
  if (priceRaw !== "") {
    price = Number(priceRaw);
    if (!isFinite(price) || price < 0 || price > 1e9) throw { userMessage: "Preço inválido." };
  }

  let images = null;
  await waitPhotos();
  if (PH.photos.length) {
    const n = PH.photos.length, todo = PH.photos.map((_, i) => i);
    images = new Array(n);
    let done = 0, stop = false;
    toast(`A enviar fotos… 0 de ${n}`, 30000);
    const worker = async () => {                       // 3 fotos de cada vez
      while (todo.length && !stop) {
        const i = todo.shift();
        try { images[i] = await apiUploadBlob(PH.photos[i].blob); }
        catch (e) { stop = true; throw e; }
        done++; toast(`A enviar fotos… ${done} de ${n}`, 30000);
      }
    };
    await Promise.all(Array.from({ length: Math.min(3, n) }, worker));
  }

  const data = { title, ...resolveCategory(fd, kind), price, description, location: val(fd, "location"), whatsapp, province: S.profile.province || "" };
  if (id) {
    if (images) data.images = images;
    await apiUpdateListing(id, data);
    resetPhotos(); toast("Publicação actualizada!"); go("#/a/" + id);
  } else {
    const mine = await apiLoadUserListings(S.user.uid);
    if (mine.filter(isActive).length >= CONFIG.MAX_PUBLICATIONS_PER_USER)
      throw { userMessage: "A tua loja está cheia por agora. Elimina uma publicação antiga e tenta de novo." };
    const newId = await apiCreateListing({ ...data, kind, images: images || [] });
    resetPhotos(); toast(`Publicado! Activo por ${CONFIG.EXPIRY_DAYS} dias.`); go("#/a/" + newId);
    setTimeout(() => showModal(tx("pub_t"), tx("pub_b"),
      [{ label: "Partilhar", primary: true, fn: shareMyBanca }, { label: "Outro produto", fn: () => go("#/publicar?kind=" + kind) }]), 700);
  }
};

function paintBatch() {

FORMS.batch = async f => {
  if (!requireProfile()) return;
  const fd = new FormData(f), kind = val(fd, "kind") === "service" ? "service" : "product";
  const defCat = val(fd, "category"), shared = val(fd, "description"), whatsapp = normalizeMozPhone(val(fd, "whatsapp"));
  await waitBatch();
  const gs = btGroups();
  if (!gs.length) throw { userMessage: "Escolhe pelo menos uma foto." };
  const openMore = () => { const d = document.getElementById("bt-more"); if (d) { d.open = true; d.scrollIntoView({ block: "center", behavior: "smooth" }); } };
  if (!whatsapp) { openMore(); throw { userMessage: "WhatsApp inválido. Usa 9 dígitos (ex.: 84 123 4567)." }; }
  const bad = (n, msg, i) => { const r = document.querySelector(`[data-row="${i}"]`); if (r) { r.classList.add("bt-bad"); r.scrollIntoView({ block: "center", behavior: "smooth" }); } throw { userMessage: gs.length > 1 ? `Artigo ${n + 1}: ${msg}` : msg[0].toUpperCase() + msg.slice(1) }; };
  document.querySelectorAll(".bt-bad").forEach(r => r.classList.remove("bt-bad"));
  gs.forEach((g, n) => {
    const it = BT.items[g.lead];
    if (String(it.title).trim().length < 3) bad(n, "escreve o nome (mínimo 3 letras).", g.lead);
    if (it.price !== "") { const pr = Number(it.price); if (!isFinite(pr) || pr < 0 || pr > 1e9) bad(n, "preço inválido.", g.lead); }
    if (!(it.cat || defCat)) { openMore(); throw { userMessage: "Escolhe a categoria em «Mais detalhes»." }; }
    if (kind === "service" && String(it.desc || shared).trim().length < 10) { openMore(); throw { userMessage: "Para serviços, escreve uma breve descrição (mínimo 10 letras) em «Mais detalhes»." }; }
  });
  const mine = await apiLoadUserListings(S.user.uid), left = CONFIG.MAX_PUBLICATIONS_PER_USER - mine.filter(isActive).length;
  if (gs.length > left) throw { userMessage: `Só podes publicar mais ${Math.max(0, left)} artigos agora. Tira alguns daqui ou elimina publicações antigas.` };

  const total = gs.length, published = [], ids = [];
  try {
    for (let n = 0; n < gs.length; n++) {
      const g = gs[n], idx = [g.lead, ...g.extra], it = BT.items[g.lead];
      toast(total > 1 ? `A publicar ${n + 1} de ${total}…` : "A publicar…", 30000);
      const images = new Array(idx.length), todo = idx.map((_, k) => k);
      await Promise.all(Array.from({ length: Math.min(3, idx.length) }, async () => {
        while (todo.length) { const k = todo.shift(); images[k] = await apiUploadBlob(BT.items[idx[k]].blob); }
      }));
      const id = await apiCreateListing({ title: String(it.title).trim(), category: it.cat || defCat, categoryCustom: "", price: it.price === "" ? null : Number(it.price),
        description: String(it.desc || "").trim() || shared, location: val(fd, "location"), whatsapp, province: S.profile.province || "", kind, images });
      ids.push(id); published.push(...idx);
    }
  } catch (e) {
    // tira da lista o que já foi publicado; o resto fica para tentar outra vez
    published.sort((a, b) => b - a).forEach(k => { URL.revokeObjectURL(BT.items[k].url); BT.items.splice(k, 1); });
    if (BT.items.length && BT.items[0].join) BT.items[0].join = false;
    paintBatch();
    throw { userMessage: ids.length ? `Publiquei ${ids.length} de ${total}. ${friendlyError(e)} O resto ficou aqui: toca em Publicar para tentar outra vez.` : friendlyError(e) };
  }
  resetBatch(); S.cache.listings = null;
  if (ids.length === 1) {
    toast(`Publicado! Activo por ${CONFIG.EXPIRY_DAYS} dias.`); go("#/a/" + ids[0]);
    setTimeout(() => showModal(tx("pub_t"), tx("pub_b"),
      [{ label: "Partilhar", primary: true, fn: shareMyBanca }, { label: "Outro produto", fn: () => go("#/publicar?kind=" + kind) }]), 700);
  } else {
    go("#/minhas");
    setTimeout(() => showModal(tx("pubn_t").replace("{n}", ids.length), tx("pubn_b"), [{ label: "Partilhar", primary: true, fn: shareMyBanca }, { label: "Fechar" }]), 600);
  }
};
async function waitBatch() {
  const t0 = Date.now();
  while (BT.busy > 0) { if (Date.now() - t0 > 60000) throw { userMessage: "As fotos ainda estão a ser preparadas. Espera um momento." }; await new Promise(r => setTimeout(r, 150)); }
}

        <textarea class="field-input tx-f" data-k="${x[0]}" rows="${x[4]}" maxlength="300">${esc(tx(x[0]))}</textarea>
        <button type="button" class="btn btn-ghost btn-sm" data-act="tx-reset" data-k="${x[0]}">Repor original</button>`).join("")}</div>`).join("")}
    <button class="btn btn-primary btn-full" data-act="tx-save">Guardar textos</button>`);
}
ACTIONS["admin-texts"] = () => textsPaint();
ACTIONS["tx-reset"] = el => { const f = document.querySelector(`.tx-f[data-k="${el.dataset.k}"]`); if (f) { f.value = TX_DEF[el.dataset.k]; toast("Original reposto. Toca em Guardar."); } };
ACTIONS["tx-save"] = async el => {
  const out = {};
  document.querySelectorAll(".tx-f").forEach(f => { const v = f.value.trim(); if (v && v !== TX_DEF[f.dataset.k]) out[f.dataset.k] = v.slice(0, 300); });
  el.disabled = true;
  try {
    await apiSaveTexts(out);
    TX = out; try { localStorage.setItem("nlh_tx", JSON.stringify(out)); } catch (e) {}
    if (window.__hpRefresh) window.__hpRefresh();
    toast("Guardado. Já vale para toda a gente.");
  } catch (e) { toast(friendlyError(e)); }
  el.disabled = false;
};
ACTIONS["note-edit"] = el => { const n = notesLoad(), x = n[Number(el.dataset.i)]; if (x) { x[el.dataset.f] = el.value; notesSave(n); } };
ACTIONS["note-reset"] = el => { const n = notesLoad(), x = n[Number(el.dataset.i)], d = x && NOTES_DEFAULT.find(y => y[2] === x.k); if (!d) return; x.b = d[1]; x.t = d[0]; notesSave(n); notesPaint(); toast("Texto original reposto."); };
ACTIONS["note-add"] = () => { const n = notesLoad(); n.push({ t: "Nova nota", b: "" }); notesSave(n); notesPaint(); };
ACTIONS["note-del"] = el => { if (!confirm("Apagar esta nota?")) return; const n = notesLoad(); n.splice(Number(el.dataset.i), 1); notesSave(n); notesPaint(); };
ACTIONS["note-copy"] = async el => {
  const x = notesLoad()[Number(el.dataset.i)]; if (!x) return;
  try { await navigator.clipboard.writeText(x.b); toast("Copiado."); }
  catch (e) { const t = document.createElement("textarea"); t.value = x.b; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); toast("Copiado."); } catch (z) { toast("Não consegui copiar. Seleciona o texto e copia."); } t.remove(); }
};

ACTIONS["admin-listings"] = async () => {

      <div class="li-actions">

ACTIONS["admin-user-status"] = async el => {

/**
 * ZONA 9 — ARRANQUE (o botão de ligar)
 * Ordem pensada para a página NUNCA ficar em branco:
 *   1) desenha já o site (cabeçalho, menu, página de entrada / início)
 *   2) em segundo plano, carrega o Firebase e descobre quem és
 *   3) quando o Firebase responde, desenha outra vez com os dados reais
 * Se o Firebase falhar (sem internet, config errada), o site continua
 * visível e mostra um aviso.
 */
ACTIONS["open-drawer"] = openDrawer;
ACTIONS["close-drawer"] = closeDrawer;

const MSG_PREVIEW = "<b>Pré-visualização</b> · O Firebase ainda não está ligado. Vês o aspecto do site; para entrar e publicar, cola os dados no topo do ficheiro (ZONA 1).";
const MSG_OFFLINE = `<b>Sem ligação ao servidor.</b> Verifica a internet. <button data-act="reload">Tentar de novo</button>`;

(function main() {
 try {
  document.title = `${CONFIG.APP_NAME} — Põe tudo num só link`;
  $$("[data-appname]").forEach(el => { el.textContent = CONFIG.APP_NAME; });
  $$("[data-appshort]").forEach(el => { el.textContent = CONFIG.APP_SHORT; });

  S.ready = true;
  S.fb = FIREBASE_READY ? "loading" : "off";   // off | loading | ready | failed
  S.authKnown = !FIREBASE_READY;

  // Primeira visita sem endereço específico -> página de entrada
  if ((!location.hash || location.hash === "#/") && !wasSeen()) startAt("#/bem-vindo");

  if (!FIREBASE_READY) { setBanner(MSG_PREVIEW); render(); return; }
  render();   // já mostra o cabeçalho e, na 1.ª visita, a página de entrada

  const failed = () => {
    if (S.fb === "ready") return; S.fb = "failed"; S.authKnown = true; setBanner("");
    _renderTok++;
    const v = document.getElementById("view");
    if (v) v.innerHTML = cloudBox("Sem ligação ao servidor", "Verifica os dados ou o Wi-Fi e tenta de novo. Assim que a internet voltar, o site abre sozinho.",
      `<button class="btn btn-primary" data-act="reload">Tentar de novo</button>`);
  };
  window.addEventListener("online", () => { if (S.fb === "failed") location.reload(); });
  const giveUp = setTimeout(failed, 12000);   // se em 12 s nada, avisa

  loadFirebase().then(() => {
    initFirebase();
    apiLoadTexts().then(t => {                       // textos editados no painel (se não houver, ficam os originais)
      const clean = {}; Object.keys(t || {}).forEach(k => { if (TX_DEF[k] !== undefined && typeof t[k] === "string") clean[k] = t[k]; });
      if (JSON.stringify(clean) === JSON.stringify(TX)) return;
      TX = clean; try { localStorage.setItem("nlh_tx", JSON.stringify(clean)); } catch (e) {}
      if (window.__hpRefresh) window.__hpRefresh(); if (!document.querySelector("form")) render();
    }).catch(() => {});
    apiOnAuth(async user => {
      clearTimeout(giveUp);
      S.fb = "ready"; setBanner("");
      S.user = user; S.profile = null; S.isAdmin = false; S.profileLoadFailed = false;
      S.myLikes = new Set(); S.likesIn = []; S.likesInAt = 0;
      if (user) {
        try {
          [S.profile, S.isAdmin] = await Promise.all([apiLoadProfile(user.uid), apiIsAdmin(user.uid)]);
        } catch (e) { S.profileLoadFailed = true; toast(friendlyError(e)); }
        if (S.profile) { try { S.myLikes = await apiLoadMyLikes(user.uid); } catch (e) { if (CONFIG.DEBUG) console.warn("gostos não carregados", e); } }
      }
      S.authKnown = true;
      if (user && !S.profileLoadFailed && parseRoute().seg[0] === "entrar") { afterLogin(); return; }
      render();
    });
  }).catch(e => { if (CONFIG.DEBUG) console.error(e); clearTimeout(giveUp); failed(); });
 } catch (e) {            // rede de segurança: mesmo com um erro inesperado o site aparece
    if (CONFIG.DEBUG) console.error(e);
    S.ready = true; S.fb = "off"; S.authKnown = true; render();
  }
})();


// ══════════ HERO: frase que alterna (a faixa roxa fica SEMPRE; só o texto muda) ══════════
const heroPhrases = () => [1, 2, 3, 4].map(i => [esc(tx("hero" + i + "_t")), esc(tx("hero" + i + "_s"))]).concat([
  ["<span class=\"nmark\">N</span>tlhanganu: onde as pessoas se encontram para negociar", "Vendedores e clientes do país inteiro, num só lugar."]
]);
(function heroRotator() {
  let i = 0;
  // desliza para a esquerda, troca o texto, e entra pela direita (sem piscar)
  const swap = (el, html) => {
    if (!el) return;
    el.classList.add("out");
    setTimeout(() => {
      el.innerHTML = html;
      el.classList.remove("out"); el.classList.add("pre");
      void el.offsetWidth;                       // força o navegador a "ver" a posição inicial
      el.classList.remove("pre");
    }, 900);
  };
  setInterval(() => {
    const h = document.getElementById("hero-rot");
    if (!h || document.hidden) return;
    const HP = heroPhrases();
    i = (i + 1) % HP.length;
    swap(h, HP[i][0]);
    setTimeout(() => swap(document.getElementById("hero-sub"), HP[i][1]), 150);
  }, 7000);
})();

// ══════════ INÍCIO: números e categorias ficam um tempo e saem sozinhos ══════════
// Saem (só uma vez) ao fim de INTRO_SECONDS, ou mais cedo se a pessoa descer até às publicações.
// A faixa roxa e os perfis em destaque NÃO saem.
const INTRO_SECONDS = 10;
(function introAutoHide() {
  let timer = null, busy = false;
  function hide() {
    clearTimeout(timer); timer = null;
    const box = document.getElementById("intro-block");
    if (!box || S.introGone) return;
    S.introGone = true;
    const r = box.getBoundingClientRect();
    if (r.bottom < 0) {                                   // já passou por cima do ecrã: remove sem saltos
      const head = document.getElementById("recent-head");
      const before = head ? head.getBoundingClientRect().top : 0;
      box.remove();
      if (head) window.scrollTo({ top: window.scrollY + (head.getBoundingClientRect().top - before), behavior: "instant" });
      return;
    }
    box.style.maxHeight = box.offsetHeight + "px";        // anima a fechar
    void box.offsetHeight;
    box.classList.add("closing"); box.style.maxHeight = "0px";
    setTimeout(() => box.remove(), 500);
  }
  function onScroll() {
    busy = false;
    const head = document.getElementById("recent-head"), box = document.getElementById("intro-block");
    if (!head || !box || S.introGone) return;
    const nav = document.getElementById("top-nav");
    if (head.getBoundingClientRect().top <= (nav ? nav.offsetHeight : 0) + 16) hide();
  }
  window.addEventListener("scroll", () => { if (!busy) { busy = true; requestAnimationFrame(onScroll); } }, { passive: true });
  const view = document.getElementById("view");
  if (view) new MutationObserver(() => {
    if (timer || S.introGone || !document.getElementById("intro-block")) return;
    timer = setTimeout(hide, INTRO_SECONDS * 1000);
  }).observe(view, { childList: true });
})();
</script>
