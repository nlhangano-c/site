a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--color-text)} /* 16px evita zoom automático no iPhone */
:focus-visible{outline:3px solid rgba(139,92,246,.45);outline-offset:2px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--color-secondary)!important;box-shadow:0 0 0 3px rgba(139,92,246,.15)}
img{display:block;max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{max-width:var(--max-width);margin:0 auto;min-height:100vh;background:var(--color-bg);position:relative}
@media(min-width:700px){body{background:#eef2f7}#app{box-shadow:0 0 60px rgba(0,0,0,.12)}}
.container{padding:0 16px}.pad{padding-top:16px;padding-bottom:40px}
.center{text-align:center}.center-pad{padding:60px 0;display:flex;justify-content:center}
.soft{color:var(--color-text-soft);font-size:13px;line-height:1.6}
.h1{font-size:22px;font-weight:800;line-height:1.25}.h1.sm{font-size:18px}.h2{font-size:15px;font-weight:700;margin-bottom:8px}
.grow{flex:1;min-width:0}.row-gap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.col-gap{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.card{background:var(--color-surface);border-radius:var(--r-xl);box-shadow:var(--shadow-card)}
.pad-card{padding:20px}
.gradient-text{background:var(--gradient-main);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* topo */
#top-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--color-border);padding:10px 12px 8px}
.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:8px}
.brand-logo{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(99,102,241,.35))}
.brand-logo.big{width:72px;height:72px;margin:0 auto;filter:drop-shadow(0 12px 16px rgba(99,102,241,.40))}
.hero-logo{position:absolute;right:14px;top:14px;width:84px;height:84px;object-fit:contain;opacity:.95;filter:drop-shadow(0 14px 18px rgba(30,10,90,.45));transform:rotate(6deg);pointer-events:none}
.hero h1{padding-right:84px}
.brand-icon{width:34px;height:34px;border-radius:10px;background:var(--gradient-main);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px}
.brand-icon.big{width:56px;height:56px;border-radius:16px;font-size:30px;margin:0 auto}
.brand-name{font-size:18px;font-weight:800;background:var(--gradient-main);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.icon-btn{width:44px;height:44px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;color:var(--color-text-soft)}
.icon-btn:active{background:var(--color-bg)}
.icon-btn.sm{width:36px;height:36px}.icon-btn.danger{color:var(--color-danger)}
.tab-bar{display:flex;gap:4px;background:var(--color-bg);border-radius:var(--r-lg);padding:4px;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:1;flex-shrink:0;padding:10px;font-size:12px;font-weight:500;border-radius:var(--r-md);color:var(--color-text-soft);text-align:center;white-space:nowrap}
.tab-btn.active{background:#fff;color:var(--color-text);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:12px 20px;border-radius:var(--r-lg);min-height:44px;transition:.15s}
.btn:disabled{opacity:.6;cursor:wait}
.btn-primary{background:var(--gradient-main);color:#fff;box-shadow:0 4px 12px rgba(139,92,246,.3)}
.btn-outline{border:2px solid var(--color-primary);color:var(--color-primary)}
.btn-ghost{background:#fff;color:var(--color-text-soft);border:1px solid var(--color-border)}
.btn-danger{background:rgba(239,68,68,.08);color:var(--color-danger);border:1px solid rgba(239,68,68,.25)}
.btn-wa{background:#25D366;color:#fff}
.btn-sm{font-size:12px;padding:8px 14px;border-radius:var(--r-md);min-height:38px}
.btn-full{width:100%}.btn:active{transform:scale(.98)}
.linklike{display:block;margin:12px auto 0;font-size:13px;color:var(--color-primary);font-weight:600;padding:8px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--color-text-soft);margin-bottom:12px;padding:8px 0}

/* formulários */
.fld{margin-bottom:14px}
.field-label{display:block;font-size:13px;font-weight:600;color:var(--color-text-soft);margin-bottom:6px}
.field-input{width:100%;border:1.5px solid var(--color-border);border-radius:var(--r-lg);padding:12px 14px;background:#fff}
textarea.field-input{resize:vertical}
.phone-box{display:flex;border:1.5px solid var(--color-border);border-radius:var(--r-lg);overflow:hidden;background:#fff}
.phone-box span{padding:12px 10px;background:var(--color-bg);font-size:14px;color:var(--color-text-soft);font-weight:600;border-right:1px solid var(--color-border)}
.phone-box input{flex:1;min-width:0;padding:12px;border:none;background:transparent}
.type-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-pick label{cursor:pointer}.type-pick input{position:absolute;opacity:0;pointer-events:none}
.type-pick span{display:block;border:2px solid var(--color-border);border-radius:14px;padding:12px 8px;text-align:center}
.type-pick small{display:block;font-size:11px;color:var(--color-text-muted)}
.type-pick input:checked+span{border-color:var(--color-primary);background:rgba(99,102,241,.06);color:var(--color-primary)}
.type-pick input:focus-visible+span{outline:3px solid rgba(139,92,246,.45)}
.photo-upload-btn{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--color-border);border-radius:var(--r-xl);padding:16px;cursor:pointer;font-size:13px;color:var(--color-text-soft);background:var(--color-bg);text-align:center}
.previews{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.previews img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.note{font-size:12px;color:var(--color-text-muted);margin:8px 0 14px;line-height:1.5}
.warn-note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:var(--r-md);padding:12px;font-size:12px;color:#92400e;margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--color-bg);border-radius:var(--r-lg);padding:4px;margin:16px 0}
.seg a{text-align:center;padding:10px;border-radius:var(--r-md);font-size:13px;font-weight:600;color:var(--color-text-soft)}
.seg a.on{background:#fff;color:var(--color-text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--color-text-muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--color-border)}

/* início */
.hero{position:relative;overflow:hidden;border-radius:var(--r-2xl);padding:24px;margin-bottom:22px;background:var(--gradient-main)}
.hero::before{content:"";position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.hero h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px;line-height:1.3;position:relative}
.hero p{font-size:13px;color:rgba(255,255,255,.88);margin-bottom:18px;position:relative}
.landing-cta{background:#fff;color:var(--color-primary);font-weight:700;font-size:14px;padding:13px 24px;border-radius:var(--r-xl);box-shadow:0 8px 24px rgba(0,0,0,.15);display:inline-block;position:relative}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-head h2{font-size:15px;font-weight:700}.section-head>a:not(.btn){font-size:12px;color:var(--color-primary);font-weight:600}
#profiles-strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;margin:0 -16px 20px;padding-left:16px;padding-right:16px;scrollbar-width:none}
#profiles-strip::-webkit-scrollbar{display:none}
.story{flex-shrink:0;text-align:center;width:64px}
.story-ring{display:block;width:60px;height:60px;margin:0 auto 6px;padding:2px;border-radius:50%;background:var(--gradient-main)}
.story-inner{display:block;width:100%;height:100%;background:#fff;border-radius:50%;padding:2px}
.story-name{display:block;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-cat{display:block;font-size:10px;color:var(--color-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat-card{background:#fff;border-radius:var(--r-xl);padding:16px 8px;text-align:center;box-shadow:var(--shadow-card)}
.stat-value{font-size:20px;font-weight:800;background:var(--gradient-main);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:11px;color:var(--color-text-muted)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.cat-btn{background:rgba(99,102,241,.07);border-radius:14px;padding:12px 4px;text-align:center;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;text-align:center}
.mini-grid>div{background:rgba(99,102,241,.06);border-radius:12px;padding:12px 4px}.mini-grid b{display:block;font-size:16px}.mini-grid small{font-size:11px;color:var(--color-text-muted)}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips-scroll::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 16px;border-radius:var(--r-full);font-size:13px;font-weight:500;background:#fff;color:var(--color-text-soft);border:1px solid var(--color-border)}
.chip.active{background:var(--gradient-main);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(139,92,246,.3)}
.chip-cat{display:inline-block;font-size:11px;font-weight:600;color:var(--color-primary);background:rgba(99,102,241,.1);padding:3px 10px;border-radius:var(--r-full)}

/* cartões */
.pub-card-a,.pub-card-b,.pub-carousel-item,.service-feed-card{display:block;background:#fff;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-card)}
.pub-card-a{margin-bottom:16px}
.pub-img-full{width:100%;aspect-ratio:16/9;object-fit:cover}
.pub-img-half{width:100%;aspect-ratio:1/1;object-fit:cover}
.pub-img-carousel{width:100%;height:140px;object-fit:cover}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:13px;font-weight:600;color:rgba(30,41,59,.6)}
.pub-body{padding:12px}
.pub-title{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}.pub-title.one{-webkit-line-clamp:1}
.pub-meta{font-size:12px;color:var(--color-text-muted);margin-bottom:6px}
.price{font-weight:800;color:var(--color-primary);font-size:15px}.price.sm{font-size:13px}.price.lg{font-size:22px}
.pub-footer{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.pub-author{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-soft)}
.pub-author-avatar{width:24px;height:24px;border-radius:50%;background:var(--gradient-main);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.pub-author-avatar.big{width:38px;height:38px;font-size:14px}
.pub-card-b-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pub-carousel{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scroll-snap-type:x mandatory;scrollbar-width:none}.pub-carousel::-webkit-scrollbar{display:none}
.pub-carousel-item{flex-shrink:0;width:190px;scroll-snap-align:start}
.badge-expiry{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r-full)}
.badge-expiry.urgent{background:rgba(239,68,68,.1);color:var(--color-danger);border:1px solid rgba(239,68,68,.2)}
.badge-expiry.ok{background:rgba(34,197,94,.1);color:var(--color-success);border:1px solid rgba(34,197,94,.2)}
.expiry-bar{height:3px;border-radius:var(--r-full);background:var(--color-border);overflow:hidden;margin:10px 0 12px}.expiry-fill{height:100%;background:var(--gradient-main)}
.service-feed-card{margin-bottom:20px}
.svc-head{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}.svc-head-t{flex:1;display:flex;flex-direction:column;min-width:0}.svc-head-t small{font-size:11px;color:var(--color-text-muted)}
.service-feed-img{width:100%;aspect-ratio:16/9;object-fit:cover}
.service-feed-body{padding:14px 16px 16px}.service-feed-title{font-size:16px;font-weight:700;margin:6px 0 2px}
.service-feed-desc{font-size:13px;color:var(--color-text-soft);line-height:1.6;margin-top:6px}

/* avatar */
.avatar{border-radius:50%;background:linear-gradient(135deg,#e0e7ff,#ede9fe);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--color-primary);flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-md{width:48px;height:48px;font-size:18px}.avatar-lg{width:72px;height:72px;font-size:26px}.avatar-fill{width:100%;height:100%;font-size:20px}
.avatar.on-grad{background:rgba(255,255,255,.2);color:#fff;border:3px solid rgba(255,255,255,.4);margin-bottom:10px}

/* perfil */
.profile-cover{height:170px;background:var(--gradient-main);position:relative}
.profile-cover-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.2))}
.profile-avatar-wrap{position:relative;margin:-42px 0 0 16px;width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:var(--gradient-main);overflow:hidden;box-shadow:var(--shadow-card)}
.profile-avatar-wrap .avatar{background:var(--gradient-main);color:#fff;font-size:30px}
.profile-info{padding-top:10px;padding-bottom:40px}
.profile-name{font-size:22px;font-weight:800}.profile-handle{font-size:13px;color:var(--color-text-muted)}
.profile-category{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--color-primary);background:rgba(99,102,241,.1);padding:4px 10px;border-radius:var(--r-full)}
.profile-bio{font-size:13px;color:var(--color-text-soft);line-height:1.6;margin-top:12px;white-space:pre-line}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.profile-stats{display:flex;gap:28px;margin-top:16px;padding:14px 0;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border)}
.profile-stat-value{font-size:18px;font-weight:800}.profile-stat-label{font-size:11px;color:var(--color-text-muted)}
.profile-social-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.social-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:var(--r-lg);font-size:13px;font-weight:600;min-height:44px}
.social-btn.wide{grid-column:span 2}
.social-btn.whatsapp{background:#25D366;color:#fff}.social-btn.instagram{background:linear-gradient(135deg,#f09433,#dc2743,#bc1888);color:#fff}
.social-btn.facebook{background:#1877F2;color:#fff}.social-btn.tiktok{background:#010101;color:#fff}.social-btn.website{background:#fff;border:1px solid var(--color-border)}

/* detalhe */
.detail-img{width:100%;border-radius:var(--r-xl);aspect-ratio:4/3;object-fit:cover;margin-bottom:8px}
.detail-thumbs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.detail-thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;cursor:pointer}
.detail-desc{white-space:pre-line;font-size:14px;color:var(--color-text-soft);line-height:1.7;margin:12px 0 16px}
.loc{display:flex;align-items:center;gap:4px;margin-top:4px}
.author-card{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:var(--r-lg);margin-bottom:12px;box-shadow:var(--shadow-card)}
.author-card>span:nth-child(2){flex:1;display:flex;flex-direction:column}.author-card small{font-size:11px;color:var(--color-text-muted)}
.owner-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--color-border)}

/* listas / admin */
.admin-list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#fff;border-radius:var(--r-lg);margin-bottom:8px;box-shadow:var(--shadow-card)}
.li-t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li-s{font-size:11px;color:var(--color-text-muted)}
.li-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.admin-stat-card{background:#fff;border-radius:var(--r-xl);padding:16px;text-align:center;box-shadow:var(--shadow-card)}
.admin-stat-value{font-size:24px;font-weight:800}.admin-stat-label{font-size:11px;color:var(--color-text-muted)}
.admin-action{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:14px;box-shadow:var(--shadow-card);text-align:left;font-size:14px;width:100%}
.admin-action small{display:block;font-size:11px;color:var(--color-text-muted)}
.admin-ico{width:40px;height:40px;border-radius:10px;background:rgba(99,102,241,.1);color:var(--color-primary);display:flex;align-items:center;justify-content:center}

/* vazio, spinner, toast */
.empty{text-align:center;padding:40px 16px;color:var(--color-text-muted)}.empty-ico{opacity:.4;display:flex;justify-content:center;margin-bottom:10px}
.empty-t{font-size:15px;font-weight:700;color:var(--color-text)}.empty-s{font-size:13px;margin:4px 0 14px}
.spinner{width:32px;height:32px;border:3px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:500;background:#1e293b;color:#fff;font-size:13px;font-weight:500;padding:12px 20px;border-radius:var(--r-xl);box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .3s;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1}

/* menu lateral */
#drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
#drawer-overlay.open{opacity:1;pointer-events:all}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,85vw);background:#fff;z-index:201;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;visibility:hidden}
#drawer.open{transform:none;visibility:visible}
.drawer-header{padding:20px;background:var(--gradient-main);position:relative}
.drawer-close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff}
.drawer-user-name{font-size:16px;font-weight:700;color:#fff}.drawer-user-role{font-size:12px;color:rgba(255,255,255,.85)}.drawer-user-link{font-size:11px;color:rgba(255,255,255,.7)}
#drawer-nav{flex:1;overflow-y:auto;padding:10px 0}
.drawer-nav-item{display:flex;align-items:center;gap:14px;padding:15px 20px;font-size:14px;font-weight:500}.drawer-nav-item:active{background:rgba(99,102,241,.06);color:var(--color-primary)}
.drawer-nav-item svg{color:var(--color-text-soft)}.drawer-divider{height:1px;background:var(--color-border);margin:8px 20px}
#drawer-foot{padding:16px 20px;border-top:1px solid var(--color-border)}#drawer-foot:empty{display:none}
.drawer-logout{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-lg);font-size:14px;font-weight:600;color:var(--color-danger);background:rgba(239,68,68,.06);width:100%}

/* aviso (pré-visualização / sem ligação) */
#banner{background:#fff7ed;border-bottom:1px solid #fed7aa;color:#9a3412;font-size:12px;line-height:1.5;padding:8px 14px}
#banner[hidden]{display:none}
#banner button{font-weight:700;text-decoration:underline;margin-left:6px;color:inherit}

/* página de entrada */
body.landing #top-nav,body.landing #banner{display:none}
body.landing #app{background:var(--gradient-main)}
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;color:#fff}
.welcome-logo{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 24px 30px rgba(20,5,70,.55));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.welcome h1{font-size:34px;font-weight:800;margin-top:12px}
.welcome-tag{opacity:.9;margin:4px 0 22px;font-size:14px}
.welcome-list{list-style:none;text-align:left;width:100%;display:grid;gap:10px;margin-bottom:24px}
.welcome-list li{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.welcome-list span{font-size:12px;opacity:.88}
.welcome-btn{display:block;width:100%;padding:14px;border-radius:16px;font-weight:700;font-size:15px;border:2px solid rgba(255,255,255,.6);color:#fff;margin-bottom:10px}
.welcome-btn.primary{background:#fff;color:var(--color-primary);border-color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.welcome-link{color:#fff;font-size:13px;opacity:.9;padding:10px;font-weight:600}

/** Lava o texto: transforma < > & " ' em símbolos inofensivos. */
function esc(v) {
  return String(v ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/** Só deixa passar links que começam por http(s) (evita "javascript:..."). */
function safeUrl(u) {
  const s = String(u ?? "").trim();
  return /^https?:\/\//i.test(s) ? s : "";
}

function initials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean).slice(0, 2);
  return parts.length ? parts.map(p => p[0].toUpperCase()).join("") : "?";
}

/** "João Silva" -> "joao-silva" (sem acentos, só letras/números/hífen) */
function slugify(text) {
  const s = String(text || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
  return s || "perfil";
}

function onlyDigits(v) { return String(v || "").replace(/\D/g, ""); }

/** Aceita 84xxxxxxx / 85... (9 dígitos a começar por 82-87), com ou sem 258. */
function normalizeMozPhone(v) {
  let d = onlyDigits(v);
  if (d.startsWith(CONFIG.COUNTRY_CODE) && d.length === 12) d = d.slice(3);
  return /^8[2-7]\d{7}$/.test(d) ? d : "";
}

function waLink(phone, text) {
  const d = normalizeMozPhone(phone);
  if (!d) return "";
  const msg = text ? "?text=" + encodeURIComponent(text) : "";
  return `https://wa.me/${CONFIG.COUNTRY_CODE}${d}${msg}`;
}

function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

function formatPrice(p) {
  if (p === null || p === undefined || p === "" || isNaN(Number(p))) return "A combinar";
  return Number(p).toLocaleString("pt-PT").replace(/\u00a0/g, " ") + " " + CONFIG.CURRENCY;
}

function toMillis(t) {
  if (!t) return 0;
  if (typeof t.toMillis === "function") return t.toMillis();
  if (typeof t === "number") return t;
  return 0;
}

function daysLeft(item) {
  return Math.max(0, Math.ceil((toMillis(item.expiresAt) - Date.now()) / DAY_MS));
}
function isActive(item) {
  return toMillis(item.expiresAt) > Date.now() && item.status === "active";
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/** Cores de reserva quando não há foto (sempre a mesma para o mesmo id). */
function placeholderGradient(seed) {
  const g = [
    "linear-gradient(135deg,#e0e7ff,#c7d2fe)", "linear-gradient(135deg,#fce7f3,#fbcfe8)",
    "linear-gradient(135deg,#d1fae5,#a7f3d0)", "linear-gradient(135deg,#fef3c7,#fde68a)",
    "linear-gradient(135deg,#ede9fe,#ddd6fe)", "linear-gradient(135deg,#e0f2fe,#bae6fd)"
  ];
  const n = String(seed || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0);
  return g[n % g.length];
}

/** Notificação curta no fundo do ecrã. */
let _toastTimer;
function toast(msg, ms = 3200) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

/** Traduz erros técnicos do Firebase para frases que qualquer pessoa entende. */
function friendlyError(err) {
  const c = (err && err.code) || "";
  const map = {
    "auth/invalid-credential": "Email ou palavra-passe incorrectos.",
    "auth/wrong-password": "Email ou palavra-passe incorrectos.",
    "auth/user-not-found": "Não existe conta com este email.",
    "auth/email-already-in-use": "Este email já tem conta. Tenta entrar.",
    "auth/weak-password": "A palavra-passe deve ter pelo menos 6 caracteres.",
    "auth/invalid-email": "O email não é válido.",
    "auth/too-many-requests": "Muitas tentativas. Espera um pouco e tenta de novo.",
    "auth/network-request-failed": "Sem internet. Verifica a ligação.",
    "auth/popup-closed-by-user": "Entrada com Google cancelada.",
    "auth/popup-blocked": "O telemóvel bloqueou a janela. Permite pop-ups e tenta de novo.",
    "auth/unauthorized-domain": "Este endereço ainda não está autorizado no Firebase (ver guia, passo do domínio).",
    "permission-denied": "Sem permissão para esta acção.",
    "unavailable": "Sem ligação ao servidor. Tenta de novo.",
    "resource-exhausted": "Limite diário grátis atingido. Tenta amanhã."
  };
  if (map[c]) return map[c];
  if (err && err.userMessage) return err.userMessage;
  if (CONFIG.DEBUG) console.error(err);
  return "Algo correu mal. Tenta de novo.";
}

/** Reduz a foto no telemóvel ANTES de enviar (poupa dados e espaço grátis). */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) return reject({ userMessage: "O ficheiro não é uma imagem." });
    if (file.size > CONFIG.MAX_UPLOAD_MB * 1024 * 1024)
      return reject({ userMessage: `Foto muito grande (máx. ${CONFIG.MAX_UPLOAD_MB} MB).` });
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, CONFIG.IMAGE_MAX_PX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject({ userMessage: "Não consegui processar a foto." }),
        "image/jpeg", CONFIG.IMAGE_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject({ userMessage: "Não consegui abrir a foto." }); };
    img.src = url;
  });
}

/**
 * 03-api.js — A ÚNICA peça que fala com o Firebase e o Cloudinary
 * ================================================================
 * O resto do site nunca toca na base de dados directamente.
 * Se um dia trocares de serviço, só reescreves este ficheiro.
 *
 * Colecções no Firestore (as "gavetas" onde ficam os dados):
 *   profiles/{uid}   -> o perfil de cada pessoa (inclui "slug", o link)
 *   slugs/{slug}     -> garante que cada link é único  { uid }
 *   listings/{id}    -> publicações (produtos E serviços; campo "kind")
 *   admins/{uid}     -> quem é administrador (criado À MÃO na consola)
 */

// Estado partilhado da aplicação (a "memória" do site enquanto está aberto)
const S = {
  user: null,        // conta Firebase (ou null = visitante)
  profile: null,     // perfil Nlhangano de quem entrou (ou null)
  isAdmin: false,
  cache: { listings: null, listingsAt: 0, profiles: null, profilesAt: 0, profileCount: null },
  editing: null      // publicação em edição
};

// ── Firebase é carregado DEPOIS de o site já estar visível ───────────
// (assim, se a internet falhar ou a biblioteca não carregar, o site
//  continua a abrir e mostra um aviso, em vez de ficar em branco)
let initializeApp, getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup,
    sendPasswordResetEmail, getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
    collection, query, where, orderBy, limit, getDocs, addDoc, serverTimestamp,
    Timestamp, runTransaction, writeBatch, getCountFromServer;

const FB_URL = "https://www.gstatic.com/firebasejs/10.14.1/";   // versão fixa: não muda sozinha
let fbApp, auth, db;

async function loadFirebase() {
  const [a, au, fs] = await Promise.all([
    import(FB_URL + "firebase-app.js"),
    import(FB_URL + "firebase-auth.js"),
    import(FB_URL + "firebase-firestore.js")
  ]);
  ({ initializeApp } = a);
  ({ getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword,
     signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } = au);
  ({ getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where,
     orderBy, limit, getDocs, addDoc, serverTimestamp, Timestamp, runTransaction,
     writeBatch, getCountFromServer } = fs);
}

function initFirebase() {
  fbApp = initializeApp(CONFIG.FIREBASE);
  auth = getAuth(fbApp);
  db = getFirestore(fbApp);
}

/** Mensagem usada quando alguém tenta entrar/publicar sem o Firebase ligado. */
const noFb = () => ({ userMessage: "O Firebase ainda não está ligado. Cola os dados no topo do ficheiro (ZONA 1) e recarrega." });

// ══════════ CONTA (login) ══════════
const apiSignUp = async (email, pw) => { if (!auth) throw noFb(); return createUserWithEmailAndPassword(auth, email, pw); };
const apiSignIn = async (email, pw) => { if (!auth) throw noFb(); return signInWithEmailAndPassword(auth, email, pw); };
const apiGoogle = async () => { if (!auth) throw noFb(); return signInWithPopup(auth, new GoogleAuthProvider()); };
const apiResetPassword = async email => { if (!auth) throw noFb(); return sendPasswordResetEmail(auth, email); };
const apiSignOut = async () => { if (auth) await signOut(auth); };
const apiOnAuth = cb => onAuthStateChanged(auth, cb);

// ══════════ PERFIS ══════════
async function apiLoadProfile(uid) {
  if (!db) return null;
  const s = await getDoc(doc(db, "profiles", uid));
  return s.exists() ? { id: s.id, ...s.data() } : null;
}

async function apiLoadProfileBySlug(slug) {
  if (!db) return null;
  const s = await getDoc(doc(db, "slugs", slug));
  if (!s.exists()) return null;
  return apiLoadProfile(s.data().uid);
}

/** Cria o perfil e reserva o link único (ex.: joao-silva, joao-silva-2...). */
async function apiCreateProfile(uid, data) {
  const base = slugify(data.proName || data.name);
  for (let i = 0; i < 8; i++) {
    const slug = i === 0 ? base : `${base}-${i + 1}`;
    try {
      await runTransaction(db, async tx => {
        const sref = doc(db, "slugs", slug);
        if ((await tx.get(sref)).exists()) throw { code: "slug-taken" };
        tx.set(sref, { uid });
        tx.set(doc(db, "profiles", uid), {
          ...data, slug, status: "active", createdAt: serverTimestamp()
        });
      });
      S.cache.profiles = null; S.cache.profileCount = null;
      return slug;
    } catch (e) {
      if (e.code !== "slug-taken") throw e;
    }
  }
  throw { userMessage: "Não consegui criar o teu link. Tenta com outro nome profissional." };
}

/** Actualiza o perfil (o link e o estado NÃO mudam aqui). */
async function apiUpdateProfile(uid, data) {
  const clean = { ...data };
  delete clean.slug; delete clean.status; delete clean.createdAt; delete clean.id;
  await updateDoc(doc(db, "profiles", uid), clean);
  S.cache.profiles = null;
  // propagar nome/foto às publicações é um passo futuro (ver guia "Depois do MVP")
}

async function apiLoadProfiles() {
  if (!db) return [];
  if (S.cache.profiles && Date.now() - S.cache.profilesAt < 60000) return S.cache.profiles;
  const snap = await getDocs(query(collection(db, "profiles"), orderBy("createdAt", "desc"), limit(20)));
  S.cache.profiles = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.status !== "suspended");
  S.cache.profilesAt = Date.now();
  return S.cache.profiles;
}

async function apiProfileCount() {
  if (!db) return 0;
  if (S.cache.profileCount !== null) return S.cache.profileCount;
  try {
    const c = await getCountFromServer(collection(db, "profiles"));
    S.cache.profileCount = c.data().count;
  } catch (e) { S.cache.profileCount = 0; }
  return S.cache.profileCount;
}

// ══════════ PUBLICAÇÕES ══════════
const _l = d => ({ id: d.id, ...d.data() });

/** Todas as publicações activas (não expiradas), mais recentes primeiro. */
async function apiLoadListings(force) {
  if (!db) return [];
  if (!force && S.cache.listings && Date.now() - S.cache.listingsAt < 60000) return S.cache.listings;
  const q = query(collection(db, "listings"),
    where("expiresAt", ">", Timestamp.now()), orderBy("expiresAt", "desc"), limit(80));
  const snap = await getDocs(q);
  S.cache.listings = snap.docs.map(_l).filter(l => l.status === "active");
  S.cache.listingsAt = Date.now();
  return S.cache.listings;
}

async function apiLoadUserListings(uid) {
  if (!db) return [];
  const snap = await getDocs(query(collection(db, "listings"), where("ownerId", "==", uid)));
  return snap.docs.map(_l).sort((a, b) => toMillis(b.createdAt) - toMillis(a.createdAt));
}

async function apiLoadListing(id) {
  if (!db) return null;
  const s = await getDoc(doc(db, "listings", id));
  return s.exists() ? _l(s) : null;
}

function _expiryFields() {
  const now = Date.now();
  return {
    expiresAt: Timestamp.fromMillis(now + CONFIG.EXPIRY_DAYS * DAY_MS),
    // purgeAt: o Firestore (política TTL) apaga o documento nesta data
    purgeAt: Timestamp.fromMillis(now + (CONFIG.EXPIRY_DAYS + CONFIG.GRACE_DAYS) * DAY_MS)
  };
}

async function apiCreateListing(data) {
  const p = S.profile;
  const ref = await addDoc(collection(db, "listings"), {
    ...data,
    ownerId: S.user.uid, ownerName: p.proName || p.name, ownerSlug: p.slug,
    status: "active", createdAt: serverTimestamp(), ..._expiryFields()
  });
  S.cache.listings = null;
  return ref.id;
}

async function apiUpdateListing(id, data) {
  await updateDoc(doc(db, "listings", id), data);
  S.cache.listings = null;
}

async function apiRenewListing(id) {
  // não mexe no "status": uma publicação suspensa pelo admin NÃO se reactiva sozinha
  await updateDoc(doc(db, "listings", id), _expiryFields());
  S.cache.listings = null;
}

async function apiDeleteListing(id) {
  await deleteDoc(doc(db, "listings", id));
  S.cache.listings = null;
}

// ══════════ FOTOS (Cloudinary, grátis) ══════════
/** Pede ao Cloudinary uma versão leve da foto (rápida em dados móveis). */
function img(url, w) {
  const u = safeUrl(url);
  return u.includes("/upload/") ? u.replace("/upload/", `/upload/f_auto,q_auto,w_${w || 800}/`) : u;
}

async function apiUploadImage(file) {
  if (!PHOTOS_READY)
    throw { userMessage: "As fotos ainda não estão configuradas (ver guia, passo Cloudinary)." };
  const blob = await compressImage(file);
  const fd = new FormData();
  fd.append("file", blob);
  fd.append("upload_preset", CONFIG.CLOUDINARY.uploadPreset);
  fd.append("folder", "nlhangano");
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.CLOUDINARY.cloudName}/image/upload`,
    { method: "POST", body: fd });
  if (!r.ok) throw { userMessage: "Falhou o envio da foto. Tenta de novo." };
  return (await r.json()).secure_url;
}

// ══════════ ADMIN ══════════
async function apiIsAdmin(uid) {
  try { return (await getDoc(doc(db, "admins", uid))).exists(); }
  catch (e) { return false; }
}

async function apiAdminStats() {
  const now = Timestamp.now();
  const [u, all, act] = await Promise.all([
    getCountFromServer(collection(db, "profiles")),
    getCountFromServer(collection(db, "listings")),
    getCountFromServer(query(collection(db, "listings"), where("expiresAt", ">", now)))
  ]);
  const total = all.data().count, active = act.data().count;
  return { users: u.data().count, total, active, expired: total - active };
}

async function apiAdminUsers() {
  const s = await getDocs(query(collection(db, "profiles"), orderBy("createdAt", "desc"), limit(100)));
  return s.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function apiAdminListings() {
  const s = await getDocs(query(collection(db, "listings"), orderBy("createdAt", "desc"), limit(100)));
  return s.docs.map(_l);
}

/** Suspende/reactiva uma pessoa e todas as suas publicações. */
async function apiAdminSetUserStatus(uid, status) {
  const items = await getDocs(query(collection(db, "listings"), where("ownerId", "==", uid)));
  const b = writeBatch(db);
  b.update(doc(db, "profiles", uid), { status });
  items.docs.slice(0, 400).forEach(d => b.update(d.ref, { status }));
  await b.commit();
  S.cache.listings = null; S.cache.profiles = null;
}

async function apiAdminSetListingStatus(id, status) {
  await updateDoc(doc(db, "listings", id), { status });
  S.cache.listings = null;
}

/** Apaga já as publicações expiradas (o TTL também o faz sozinho). */
async function apiAdminDeleteExpired() {
  const s = await getDocs(query(collection(db, "listings"),
    where("expiresAt", "<", Timestamp.now()), limit(400)));
  const b = writeBatch(db);
  s.docs.forEach(d => b.delete(d.ref));
  await b.commit();
  S.cache.listings = null;
  return s.size;
}

function renderFeed(items) {
  let html = "", i = 0, n = 0;
  while (i < items.length) {
    const m = n++ % 3;
    if (m === 1 && i + 1 < items.length) { html += `<div class="pub-card-b-wrap">${cardB(items[i])}${cardB(items[i + 1])}</div>`; i += 2; }
    else if (m === 2 && items.length - i >= 2) { const c = items.slice(i, i + 3); html += carousel(c); i += c.length; }

// ══════════ Acções e formulários (preenchidos nos outros ficheiros) ══════════
const ACTIONS = {};   // botões:   <button data-act="nome">
const FORMS = {};     // formulários: <form data-form="nome">

async function withBusy(btn, fn) {
  if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = "Aguarde…"; }
  try { return await fn(); }
  catch (e) { toast(friendlyError(e)); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = btn.dataset.t; } }
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a && ACTIONS[a.dataset.act]) { e.preventDefault(); withBusy(null, () => ACTIONS[a.dataset.act](a, e)); return; }
  const lk = e.target.closest('a[href^="#/"]');                 // links internos (#/vitrine, #/p/...)
  if (lk && !e.defaultPrevented && !e.ctrlKey && !e.metaKey) { e.preventDefault(); go(lk.getAttribute("href")); }
  if (e.target.closest("#drawer a")) closeDrawer();
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  if (FORMS[f.dataset.form]) withBusy(f.querySelector("[type=submit]"), () => FORMS[f.dataset.form](f));
});
document.addEventListener("change", e => { if (e.target.dataset.onchange && ACTIONS[e.target.dataset.onchange]) ACTIONS[e.target.dataset.onchange](e.target, e); });
document.addEventListener("input", e => { if (e.target.dataset.oninput && ACTIONS[e.target.dataset.oninput]) ACTIONS[e.target.dataset.oninput](e.target, e); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function parseRoute() {
  const raw = (location.hash || S.startHash || "#/").slice(1);   // S.startHash: plano B quando o ambiente não deixa mudar o endereço
  const [path, qs] = raw.split("?");
  return { seg: path.split("/").filter(Boolean).map(decodeURIComponent), qs: new URLSearchParams(qs || "") };
}
/** Vai para outra página. Se o ambiente (ex.: pré-visualização dentro de uma app) não deixar
 *  mudar o endereço, guarda a página em memória e desenha na mesma — nunca fica preso. */
function go(hash) {
  try { location.hash = hash; } catch (e) {}
  let ok = false;
  try { ok = decodeURIComponent(location.hash) === decodeURIComponent(hash); } catch (e) { ok = location.hash === hash; }
  if (!ok) { S.startHash = hash; render(); }
}
/** Muda o endereço sem recarregar; com plano B igual ao go(). */
function startAt(hash) {
  try { history.replaceState(null, "", hash); return; } catch (e) {}
  go(hash);
}

// Páginas que precisam de saber QUEM és (esperam pelo login do Firebase)
const PROTECTED = ["perfil", "publicar", "editar", "minhas", "entrar", "criar-perfil", "editar-perfil", "admin"];

/** Barra de aviso por baixo do cabeçalho (modo pré-visualização / sem ligação). */
function setBanner(html) {
  const b = $("#banner"); if (!b) return;
  b.innerHTML = html || ""; b.hidden = !html;
}
ACTIONS.reload = () => location.reload();

/** Guarda que já viste a página de entrada (para não voltar a aparecer sempre). */
function markSeen() { try { localStorage.setItem("nlh_seen", "1"); } catch (e) {} }
function wasSeen() { try { return localStorage.getItem("nlh_seen") === "1"; } catch (e) { return true; } }
/** Endereço da página sem o "#..." (funciona também a abrir o ficheiro directamente). */
const pageUrl = () => location.href.split("#")[0];

let _renderTok = 0;
async function render() {
  if (!S.ready) return;
  const tok = ++_renderTok;
  const { seg, qs } = parseRoute();
  const key = seg[0] || "inicio";
  document.body.classList.toggle("landing", key === "bem-vindo");   // esconde o cabeçalho na página de entrada
  if (key !== "bem-vindo") markSeen();
  const own = key === "p" && S.profile && seg[1] === S.profile.slug;
  renderTabs(own ? "perfil" : ({ perfil: "perfil", p: "", a: "", entrar: "perfil" }[key] ?? key));
  const view = $("#view");
  view.innerHTML = SPINNER;
  window.scrollTo(0, 0);
  // Firebase ainda a ligar? Mostra a roda; o site volta a desenhar sozinho quando estiver pronto.
  if (key !== "bem-vindo" && FIREBASE_READY && (S.fb === "loading" || (!S.authKnown && PROTECTED.includes(key)))) return;
  try {
    let html;
    switch (key) {
      case "bem-vindo": html = await viewWelcome(); break;
      case "inicio": html = await viewHome(); break;
      case "vitrine": html = await viewShowcase(qs.get("cat") || "Todos"); break;
      case "servicos": html = await viewServices(qs.get("cat") || "Todos"); break;
      case "p": html = await viewProfile(seg[1]); break;
      case "perfil": html = await viewProfile(null); break;
      case "a": html = await viewListing(seg[1]); break;
      case "publicar": html = await viewListingForm(null, qs.get("kind")); break;
      case "editar": html = await viewListingForm(seg[1]); break;
      case "minhas": html = await viewMine(); break;
      case "entrar": html = await viewAuth(qs.get("m")); break;
      case "criar-perfil": html = await viewProfileForm(false); break;
      case "editar-perfil": html = await viewProfileForm(true); break;
      case "pesquisar": html = await viewSearch(); break;
      case "admin": html = await viewAdmin(); break;
      default: html = notFoundBox();
    }
    if (tok !== _renderTok || html === null) return; // outra página já tomou conta, ou houve redirecionamento
    view.innerHTML = html;
    if (typeof afterRender === "function") afterRender(key);
  } catch (e) {
    if (tok !== _renderTok) return;
    if (CONFIG.DEBUG) console.error(e);
    view.innerHTML = emptyBox("Não foi possível carregar", friendlyError(e),
      `<button class="btn btn-primary" data-act="retry">Tentar de novo</button>`);
  }
}
ACTIONS.retry = () => { S.cache.listings = null; render(); };
window.addEventListener("hashchange", render);

// ══════════ Protecções de acesso ══════════
function requireAuth(next) {
  if (S.user) return true;
  S.next = next || location.hash; toast("Entra na tua conta primeiro."); go("#/entrar"); return false;
}
function requireProfile(next) {
  if (!requireAuth(next)) return false;
  if (S.profileLoadFailed) { toast("Sem ligação. Tenta de novo."); return false; }
  if (!S.profile) { S.next = next || location.hash; toast("Completa o teu perfil primeiro."); go("#/criar-perfil"); return false; }
  return true;
}

    ..._searchData.profiles.filter(p => norm(p.name + " " + p.proName + " " + p.category).includes(q))

    : `<p class="soft center" style="padding:20px 0">Sem resultados para "${esc(el.value)}"</p>`;

// ══════════ ACÇÕES partilhadas ══════════
async function shareLink(url, title) {
  if (navigator.share) { try { await navigator.share({ title, url }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(url); toast("Link copiado!"); }
  catch (e) { prompt("Copia o link:", url); }
}

function viewAuthPrompt() {
  return authCard(`<p class="soft center" style="margin:16px 0">Entra para ver e gerir o teu perfil.</p>
    <a class="btn btn-primary btn-full" href="#/entrar">Entrar</a>

}

function authFields(f) {
  const fd = new FormData(f), email = val(fd, "email"), pw = String(fd.get("password") || "");
  if (!isValidEmail(email)) throw { userMessage: "Escreve um email válido." };
  if (pw.length < 6) throw { userMessage: "A palavra-passe deve ter pelo menos 6 caracteres." };
  return [email, pw];
}
FORMS.signin = async f => { const [e, p] = authFields(f); await apiSignIn(e, p); };
FORMS.signup = async f => { const [e, p] = authFields(f); await apiSignUp(e, p); };
ACTIONS.google = async () => { await apiGoogle(); };
ACTIONS.forgot = async () => {
  const email = ($("#auth-email") || {}).value || "";
  if (!isValidEmail(email.trim())) { toast("Escreve o teu email primeiro."); return; }
  await apiResetPassword(email.trim());
  toast("Enviámos um email para repor a palavra-passe.");
};

/** Para onde ir depois de entrar. */
function afterLogin() {
  const next = S.next; S.next = null;
  if (!S.profile) go("#/criar-perfil");
  else go(next && next !== "#/entrar" ? next : "#/perfil");
}

ACTIONS["profile-type"] = el => {
  const sel = $("#pf-category"); if (sel) sel.innerHTML = optionsHtml(catsFor(el.value), "", "Seleccionar categoria…");
};
ACTIONS["preview-files"] = el => {
  const box = document.getElementById(el.dataset.target); if (!box) return;
  box.innerHTML = "";
  Array.from(el.files).slice(0, CONFIG.MAX_IMAGES).forEach(file => {
    const i = document.createElement("img"); i.src = URL.createObjectURL(file); i.alt = ""; box.appendChild(i);
  });
};

function cleanHandle(v) { return v.replace(/^@/, "").replace(/[^\w.\-]/g, "").slice(0, 60); }

FORMS.profile = async f => {
  const editing = !!f.dataset.editing, fd = new FormData(f);
  const name = val(fd, "name"), phone = normalizeMozPhone(val(fd, "phone"));
  if (name.length < 2) throw { userMessage: "Escreve o teu nome completo." };
  if (!phone) throw { userMessage: "Telefone inválido. Usa 9 dígitos (ex.: 84 123 4567)." };
  if (!val(fd, "province")) throw { userMessage: "Escolhe a tua província." };
  if (!val(fd, "category")) throw { userMessage: "Escolhe a tua categoria." };
  let website = val(fd, "website");
  if (website && !/^https?:\/\//i.test(website)) website = "https://" + website;
  if (website && !safeUrl(website)) throw { userMessage: "O website não é válido." };

  const data = {
    type: val(fd, "type") === "service" ? "service" : "seller",
    name, proName: val(fd, "proName"), phone,
    province: val(fd, "province"), category: val(fd, "category"), bio: val(fd, "bio"),
    instagram: cleanHandle(val(fd, "instagram")), tiktok: cleanHandle(val(fd, "tiktok")),
    facebook: val(fd, "facebook"), website,
    photoUrl: (S.profile && S.profile.photoUrl) || "", coverUrl: (S.profile && S.profile.coverUrl) || ""
  };
  const av = f.elements.avatar, cv = f.elements.cover;
  if (av && av.files[0]) { toast("A enviar foto de perfil…", 15000); data.photoUrl = await apiUploadImage(av.files[0]); }
  if (cv && cv.files[0]) { toast("A enviar capa…", 15000); data.coverUrl = await apiUploadImage(cv.files[0]); }

  if (editing) {
    await apiUpdateProfile(S.user.uid, data);
    S.profile = { ...S.profile, ...data };
    toast("Perfil actualizado!");
  } else {
    await apiCreateProfile(S.user.uid, data);
    S.profile = await apiLoadProfile(S.user.uid);
    toast("Perfil criado! Já tens o teu link.");
  }
  S.next = null; go("#/perfil");
};

async function viewListingForm(id, kindParam) {
  if (!requireProfile(id ? "#/editar/" + id : "#/publicar")) return null;
  let l = null;
  if (id) {
    l = await apiLoadListing(id);
    if (!l || l.ownerId !== S.user.uid) return notFoundBox();
  } else {
    const mine = await apiLoadUserListings(S.user.uid);
    if (mine.filter(isActive).length >= CONFIG.MAX_PUBLICATIONS_PER_USER)
      return emptyBox("Limite atingido", `Tens ${CONFIG.MAX_PUBLICATIONS_PER_USER} publicações activas. Elimina ou espera que expirem.`,
        `<a class="btn btn-primary btn-sm" href="#/minhas">Ver as minhas</a>`);
  }
  const kind = l ? l.kind : (["product", "service"].includes(kindParam) ? kindParam : (S.profile.type === "service" ? "service" : "product"));
  const cats = kind === "service" ? CONFIG.CATEGORIES_SERVICES : CONFIG.CATEGORIES_PRODUCTS;

      ${l ? "" : `<div class="fld"><div class="type-pick">
        <label><input type="radio" name="kind" value="product" ${kind === "product" ? "checked" : ""} data-onchange="listing-kind"><span><b>Produto</b><small>Vender algo</small></span></label>
        <label><input type="radio" name="kind" value="service" ${kind === "service" ? "checked" : ""} data-onchange="listing-kind"><span><b>Serviço</b><small>Oferecer trabalho</small></span></label>
      </div></div>`}
      <div class="fld"><label class="field-label">Título *</label>
        <input class="field-input" name="title" maxlength="80" placeholder="Ex: Vestido floral premium" value="${esc(x.title || "")}"></div>
      <div class="fld"><label class="field-label">Categoria *</label>
        <select class="field-input" name="category" id="lf-category">${optionsHtml(cats, x.category, "Seleccionar…")}</select></div>
      <div class="fld"><label class="field-label">Preço em ${CONFIG.CURRENCY} (vazio = "A combinar")</label>
        <input class="field-input" name="price" type="number" inputmode="numeric" min="0" max="1000000000" step="1" placeholder="Ex: 1500" value="${x.price ?? ""}"></div>
      <div class="fld"><label class="field-label">Descrição <span id="lf-req">${kind === "service" ? "*" : ""}</span></label>
        <textarea class="field-input" name="description" rows="4" maxlength="1000" placeholder="Detalhes, medidas, o que inclui, disponibilidade…">${esc(x.description || "")}</textarea></div>
      <div class="fld"><label class="field-label">Localização</label>
        <input class="field-input" name="location" maxlength="80" placeholder="Ex: Maputo, Sommerschield" value="${esc(x.location || "")}"></div>
      <div class="fld"><label class="field-label">WhatsApp de contacto *</label>
        <div class="phone-box"><span>+${CONFIG.COUNTRY_CODE}</span><input name="whatsapp" type="tel" inputmode="tel" placeholder="84 123 4567" maxlength="15" value="${esc(x.whatsapp || S.profile.phone || "")}"></div></div>
      ${PHOTOS_READY ? `<div class="fld"><label class="field-label">Fotos (até ${CONFIG.MAX_IMAGES})</label>
        <label class="photo-upload-btn">${ic("image", 22)}<span>${l ? "Escolher novas fotos (substitui as actuais)" : "Toca para escolher fotos"}</span>
        <input type="file" name="photos" accept="image/*" multiple hidden data-onchange="preview-files" data-target="pv-photos"></label>
        <div id="pv-photos" class="previews">${(x.images || []).map(u => `<img src="${esc(img(u, 300))}" alt="">`).join("")}</div></div>`
        : `<p class="note">Fotos desligadas até configurares o Cloudinary (ver guia). Podes publicar sem foto.</p>`}
      <div class="warn-note">Fica activa por <b>${CONFIG.EXPIRY_DAYS} dias</b> e depois expira. Podes renovar quando quiseres.</div>
      <button class="btn btn-primary btn-full" style="padding:14px" type="submit">${l ? "Guardar alterações" : "Publicar"}</button>

ACTIONS["listing-kind"] = el => {
  const sel = $("#lf-category"); if (!sel) return;
  sel.innerHTML = optionsHtml(el.value === "service" ? CONFIG.CATEGORIES_SERVICES : CONFIG.CATEGORIES_PRODUCTS, "", "Seleccionar…");
  const r = $("#lf-req"); if (r) r.textContent = el.value === "service" ? "*" : "";
  $("form[data-form=listing]").dataset.kind = el.value;
};

FORMS.listing = async f => {
  if (!requireProfile()) return;
  const fd = new FormData(f), id = f.dataset.id;
  const kind = id ? f.dataset.kind : (val(fd, "kind") === "service" ? "service" : "product");
  const title = val(fd, "title"), category = val(fd, "category"), description = val(fd, "description");
  const whatsapp = normalizeMozPhone(val(fd, "whatsapp"));
  const priceRaw = val(fd, "price");
  if (title.length < 3) throw { userMessage: "O título deve ter pelo menos 3 caracteres." };
  if (!category) throw { userMessage: "Escolhe uma categoria." };
  if (kind === "service" && description.length < 10) throw { userMessage: "Descreve o serviço (mínimo 10 caracteres)." };
  if (!whatsapp) throw { userMessage: "WhatsApp inválido. Usa 9 dígitos (ex.: 84 123 4567)." };
  let price = null;
  if (priceRaw !== "") {
    price = Number(priceRaw);
    if (!isFinite(price) || price < 0 || price > 1e9) throw { userMessage: "Preço inválido." };
  }

  let images = null;
  const input = f.elements.photos;
  if (input && input.files.length) {
    const files = Array.from(input.files).slice(0, CONFIG.MAX_IMAGES);
    images = [];
    for (let i = 0; i < files.length; i++) {
      toast(`A enviar foto ${i + 1} de ${files.length}…`, 20000);
      images.push(await apiUploadImage(files[i]));
    }
  }

  const data = { title, category, price, description, location: val(fd, "location"), whatsapp };
  if (id) {
    if (images) data.images = images;
    await apiUpdateListing(id, data);
    toast("Publicação actualizada!"); go("#/a/" + id);
  } else {
    const mine = await apiLoadUserListings(S.user.uid);
    if (mine.filter(isActive).length >= CONFIG.MAX_PUBLICATIONS_PER_USER)
      throw { userMessage: "Já atingiste o limite de publicações activas." };
    const newId = await apiCreateListing({ ...data, kind, images: images || [] });
    toast(`Publicado! Activo por ${CONFIG.EXPIRY_DAYS} dias.`); go("#/a/" + newId);
  }
};

/**
 * ZONA 9 — ARRANQUE (o botão de ligar)
 * Ordem pensada para a página NUNCA ficar em branco:
 *   1) desenha já o site (cabeçalho, menu, página de entrada / início)
 *   2) em segundo plano, carrega o Firebase e descobre quem és
 *   3) quando o Firebase responde, desenha outra vez com os dados reais
 * Se o Firebase falhar (sem internet, config errada), o site continua
 * visível e mostra um aviso.
 */
ACTIONS["open-drawer"] = openDrawer;
ACTIONS["close-drawer"] = closeDrawer;

const MSG_PREVIEW = "<b>Pré-visualização</b> · O Firebase ainda não está ligado. Vês o aspecto do site; para entrar e publicar, cola os dados no topo do ficheiro (ZONA 1).";
const MSG_OFFLINE = `<b>Sem ligação ao servidor.</b> Verifica a internet. <button data-act="reload">Tentar de novo</button>`;

(function main() {
 try {
  document.title = `${CONFIG.APP_NAME} — Vitrine Digital`;
  $$("[data-appname]").forEach(el => { el.textContent = CONFIG.APP_NAME; });

  S.ready = true;
  S.fb = FIREBASE_READY ? "loading" : "off";   // off | loading | ready | failed
  S.authKnown = !FIREBASE_READY;

  // Primeira visita sem endereço específico -> página de entrada
  if ((!location.hash || location.hash === "#/") && !wasSeen()) startAt("#/bem-vindo");

  if (!FIREBASE_READY) { setBanner(MSG_PREVIEW); render(); return; }
  render();   // já mostra o cabeçalho e, na 1.ª visita, a página de entrada

  const failed = () => { if (S.fb === "ready") return; S.fb = "failed"; S.authKnown = true; setBanner(MSG_OFFLINE); render(); };
  const giveUp = setTimeout(failed, 12000);   // se em 12 s nada, avisa

  loadFirebase().then(() => {
    initFirebase();
    apiOnAuth(async user => {
      clearTimeout(giveUp);
      S.fb = "ready"; setBanner("");
      S.user = user; S.profile = null; S.isAdmin = false; S.profileLoadFailed = false;
      if (user) {
        try {
          [S.profile, S.isAdmin] = await Promise.all([apiLoadProfile(user.uid), apiIsAdmin(user.uid)]);
        } catch (e) { S.profileLoadFailed = true; toast(friendlyError(e)); }
      }
      S.authKnown = true;
      if (user && !S.profileLoadFailed && parseRoute().seg[0] === "entrar") { afterLogin(); return; }
      render();
    });
  }).catch(e => { if (CONFIG.DEBUG) console.error(e); clearTimeout(giveUp); failed(); });
 } catch (e) {            // rede de segurança: mesmo com um erro inesperado o site aparece
    if (CONFIG.DEBUG) console.error(e);
    S.ready = true; S.fb = "off"; S.authKnown = true; render();
  }
})();

</script>
</body>
</html>
